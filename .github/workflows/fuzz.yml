name: Fuzz

# Nightly libFuzzer session on the asset parsers (gaps review H5): lodepng
# (the PNG decoder gfx4snes and img2snes vendor), smconv's Impulse Tracker
# loader, cute_tiled (tmx2snes), the Aseprite JSON parser and stb_image
# (font2snes) — five targets, each for ten minutes under ASan + UBSan from
# the golden fixtures, one after the other. A crash fails the run and uploads the input; the fix commits it
# under tools/fuzz/crashes/<target>/, which `make fuzz-replay` runs on every
# push inside the sanitizer job, so a found bug stays fixed.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: seconds per target
        default: "600"
  schedule:
    - cron: '30 3 * * *'   # nightly, 03:30 UTC

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # 5 targets x 600 s = 50 min of fuzzing, plus building the harnesses.
    # It was 40 when there were two targets; three were added without it,
    # so every night that found nothing was killed at 40 min and shown as
    # "cancelled" (2026-09-20, -21, -23, -25): the workflow could never pass.
    # Raise it with the target list or the seconds.
    timeout-minutes: 70
    steps:
      # A scheduled run starts on the default branch (main), which lags
      # develop by days between releases: every night re-tested the last
      # release and re-found bugs already fixed (fuzz: 0 green of 8,
      # 2026-09-18 to 25). Scheduled runs test develop's tip instead.
      - name: Check out OpenSNES
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Fuzz the parsers
        run: make fuzz FUZZ_SECONDS=${{ github.event.inputs.seconds || '600' }}

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: tools/fuzz/corpus/*/crash-*
          if-no-files-found: ignore
