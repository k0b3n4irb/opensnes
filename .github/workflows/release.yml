name: Release

# Triggered when a version tag is pushed (e.g. v0.7.0)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # P4.2: tags are only valid from `main`. This guard blocks a tag pushed
  # against develop or a feature branch — see CONTRIBUTING.md for the
  # branching policy.
  verify-tag-on-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out OpenSNES
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to walk merge-base

      - name: Reject tag if not on main
        run: |
          TAG_SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "ERROR: tag commit $TAG_SHA is not reachable from origin/main."
            echo "       Tags may only be cut from main. Merge develop into main"
            echo "       via a release PR first, then re-tag the merge commit."
            exit 1
          fi
          echo "OK: tag commit is on main."

  build:
    needs: verify-tag-on-main
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            name: linux
            arch: arm64
          - os: windows-latest
            name: windows
            arch: x86_64
          - os: macos-latest
            name: darwin
            arch: arm64

    steps:
      # ------------------------------------ #
      # Install dependencies                 #
      # ------------------------------------ #
      - name: Install dependencies for Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt update -y
          sudo apt-get install -y build-essential \
              clang \
              cmake \
              make \
              git \
              doxygen \
              zip

      - name: Install dependencies for Windows
        if: matrix.name == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-doxygen
            mingw-w64-ucrt-x86_64-python
            base-devel
            git
            zip

      - name: Install dependencies for macOS
        if: matrix.name == 'darwin'
        run: |
          brew update || true
          brew install doxygen zip || true

      # ------------------------------------ #
      # Checkout the project                 #
      # ------------------------------------ #
      - name: Check out OpenSNES
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------ #
      # Build & create release package       #
      # ------------------------------------ #
      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build release (Linux)
        if: matrix.name == 'linux'
        run: |
          export OPENSNES_HOME=$(pwd)
          make release VERSION=${{ steps.version.outputs.tag }} 2>&1 | tee opensnes_release_${{ matrix.name }}.log

      - name: Build release (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: |
          set -o pipefail
          export OPENSNES_HOME=$(pwd)
          # Make-level retry dismantled 2026-07-04 (segfault class believed
          # FIXED since cproc ea95cac; the loop could mask real failures).
          # The cc65816-level retry stays, with telemetry below.
          export CC65816_RETRY_LOG=$(pwd)/cproc_retries.log
          make release VERSION=${{ steps.version.outputs.tag }} 2>&1 | tee opensnes_release_${{ matrix.name }}.log

      - name: Report cproc segfault-retry count (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: |
          n=0
          [ -f cproc_retries.log ] && n=$(wc -l < cproc_retries.log)
          echo "### cproc segfault retries: $n" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            echo "::warning::cproc segfault retry fired $n time(s) during the release build (see KNOWN_LIMITATIONS.md)"
          fi

      - name: Build release (macOS)
        if: matrix.name == 'darwin'
        run: |
          export OPENSNES_HOME=$(pwd)
          make release VERSION=${{ steps.version.outputs.tag }} 2>&1 | tee opensnes_release_${{ matrix.name }}.log

      # ------------------------------------ #
      # Tests (luna harness, see make tests) #
      # ------------------------------------ #
      # Full test suite: make tests   (luna coverage + visual + probes)
      # CI validates build success only. Symmap overlap check on built examples:
      - name: Validate examples (Linux/macOS)
        if: matrix.name != 'windows'
        run: |
          echo "=== Validating Examples ===" | tee -a opensnes_release_${{ matrix.name }}.log
          for sym in $(find examples -name "*.sym" 2>/dev/null); do
            python3 devtools/symmap/symmap.py --check-overlap "$sym" 2>&1 | tee -a opensnes_release_${{ matrix.name }}.log
          done
          true

      - name: Validate examples (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: |
          echo "=== Validating Examples ===" | tee -a opensnes_release_${{ matrix.name }}.log
          for sym in $(find examples -name "*.sym" 2>/dev/null); do
            python3 devtools/symmap/symmap.py --check-overlap "$sym" 2>&1 | tee -a opensnes_release_${{ matrix.name }}.log
          done
          true

      - name: Smoke-test ROMs with luna (Linux)
        # A shipped artifact must have EXECUTED ROMs on its own arch before
        # publishing — build success alone proved nothing about the arm64
        # zip until now. Corpus liveness boots all 56 examples (incl. SA-1,
        # SuperFX and DSP-1, which luna runs natively) in ~1 minute. The
        # full 3-pillar suite still gates PRs in opensnes_build.yml; this
        # is the release-side execution check (luna ships for both linux
        # x86_64 and aarch64).
        if: matrix.name == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/install-luna.sh
          python3 tools/luna-test/luna_runner.py --coverage

      # ------------------------------------ #
      # Upload zip as artifact for release   #
      # ------------------------------------ #
      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: opensnes-${{ steps.version.outputs.tag }}-${{ matrix.name }}-${{ matrix.arch }}
          path: release/opensnes_${{ steps.version.outputs.tag }}_${{ matrix.name }}_${{ matrix.arch }}.zip

  # ------------------------------------ #
  # Create GitHub Release                #
  # ------------------------------------ #
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out OpenSNES
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          VERSION="${TAG#v}"

          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}. See [CHANGELOG.md](CHANGELOG.md) for details."
          fi

          # Write to file (handles multiline)
          cat > release_notes.md << NOTESEOF
          ## What's in this release

          ${NOTES}

          ---

          ## Download

          | Platform | File | Architecture |
          |----------|------|--------------|
          | **Linux** | \`opensnes_${TAG}_linux_x86_64.zip\` | x86_64 |
          | **Linux** | \`opensnes_${TAG}_linux_arm64.zip\` | arm64 (aarch64) |
          | **macOS** | \`opensnes_${TAG}_darwin_arm64.zip\` | arm64 (Apple Silicon) |
          | **Windows** | \`opensnes_${TAG}_windows_x86_64.zip\` | x86_64 (MSYS2 UCRT64) |

          ### Quick start

          1. Download and extract the zip for your platform
          2. Set \`OPENSNES=/path/to/opensnes\` in your project's Makefile
          3. \`make\` — your first ROM is ready

          See [GETTING_STARTED.md](docs/GETTING_STARTED.md) for full instructions.
          NOTESEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: OpenSNES ${{ steps.tag.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-rc') || contains(steps.tag.outputs.version, '-beta') }}
          files: |
            artifacts/opensnes-${{ steps.tag.outputs.version }}-linux-x86_64/opensnes_${{ steps.tag.outputs.version }}_linux_x86_64.zip
            artifacts/opensnes-${{ steps.tag.outputs.version }}-linux-arm64/opensnes_${{ steps.tag.outputs.version }}_linux_arm64.zip
            artifacts/opensnes-${{ steps.tag.outputs.version }}-darwin-arm64/opensnes_${{ steps.tag.outputs.version }}_darwin_arm64.zip
            artifacts/opensnes-${{ steps.tag.outputs.version }}-windows-x86_64/opensnes_${{ steps.tag.outputs.version }}_windows_x86_64.zip
