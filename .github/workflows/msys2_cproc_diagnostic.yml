name: MSYS2 cproc Segfault Diagnostic

# Monitor for the (believed-fixed) non-deterministic cproc segfaults on MSYS2.
#
# History: segfaults on struct/union/initializer-heavy files appeared 2026-02-07;
# three retry layers were added 2026-03-05/06; cproc ea95cac ("initialize all
# struct type fields in mktype() to prevent UB") landed 2026-03-07 and matches
# the crash profile exactly (heap-layout-dependent reads of uninitialized type
# fields). A 2026-07-04 investigation found zero retries across sampled CI
# builds and zero ASan/UBSan/MSan findings on Linux over the full corpus.
#
# This workflow therefore runs a monthly stress (100x per historical culprit
# file) and FAILS if any segfault occurs — a red run means the class has
# resurfaced. Per-build retry telemetry lives in opensnes_build.yml
# ("Report cproc segfault-retry count"). Retirement plan for the retry
# scaffolding: KNOWN_LIMITATIONS.md (MSYS2 note).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'   # monthly, 1st at 06:00 UTC

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-python
            base-devel
            git

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # --------------------------------------------------------
      # Step 1: Normal build (baseline)
      # --------------------------------------------------------
      - name: Build compiler (normal)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          echo "=== System info ==="
          uname -a
          cc --version | head -2
          echo "=== Building compiler ==="
          make compiler 2>&1
          echo "=== Binaries ==="
          ls -la bin/
          file bin/cproc-qbe.exe bin/qbe.exe 2>/dev/null || true
          ldd bin/cproc-qbe.exe 2>/dev/null || true

      # --------------------------------------------------------
      # Step 2: Stress the historical culprit files 100x each.
      # THE GATE: any segfault fails the workflow (the class resurfaced).
      # Fixtures live in devtools/compiler-tests/cases/ (the old
      # tests/compiler/ path died with the opensnes-emu submodule).
      # --------------------------------------------------------
      - name: "Stress test: historical culprit files (100x, gating)"
        shell: msys2 {0}
        run: |
          CC="./bin/cc65816"
          TESTS=(
            devtools/compiler-tests/cases/test_union.c
            devtools/compiler-tests/cases/test_string_init.c
            devtools/compiler-tests/cases/test_nested_struct.c
            devtools/compiler-tests/cases/test_global_struct_init.c
            devtools/compiler-tests/cases/test_struct_ptr_init.c
          )
          RUNS=100
          total_segfaults=0
          echo "=== Stress testing $RUNS runs per file ==="
          for src in "${TESTS[@]}"; do
            name=$(basename "$src" .c)
            pass=0; fail=0; segfault=0
            for i in $(seq 1 $RUNS); do
              "$CC" -Ilib/include "$src" -o /dev/null 2>/tmp/diag_err_${name}.txt && rc=0 || rc=$?
              if [ $rc -eq 0 ]; then
                pass=$((pass + 1))
              elif [ $rc -eq 139 ] || grep -qi 'segmentation fault\|segfault' /tmp/diag_err_${name}.txt 2>/dev/null; then
                segfault=$((segfault + 1))
                echo "  SEGFAULT: $name run $i (exit=$rc)"
                cp /tmp/diag_err_${name}.txt /tmp/diag_segv_${name}_${i}.txt 2>/dev/null || true
              else
                fail=$((fail + 1))
                echo "  FAIL: $name run $i (exit=$rc)"
                cat /tmp/diag_err_${name}.txt 2>/dev/null || true
              fi
            done
            echo "$name: $pass/$RUNS pass, $segfault segfault, $fail other fail"
            echo "- \`$name\`: $pass/$RUNS pass, **$segfault segfault**, $fail other fail" >> "$GITHUB_STEP_SUMMARY"
            total_segfaults=$((total_segfaults + segfault))
          done
          echo "=== Stress test complete: $total_segfaults segfault(s) total ==="
          if [ "$total_segfaults" -gt 0 ]; then
            echo "::error::cproc segfault class has RESURFACED ($total_segfaults hits) — see KNOWN_LIMITATIONS.md MSYS2 note"
            exit 1
          fi

      # --------------------------------------------------------
      # Step 3 used to build cproc with UBSan (no ASan runtime on MinGW) and
      # run the culprit files, non-gating. Retired 2026-09-12: the Linux
      # `sanitizers` job in lint.yml builds the whole host toolchain with
      # ASan + UBSan on every push and PR and gates on any report.
      # --------------------------------------------------------
      # --------------------------------------------------------
      # Step 4: Full compiler pattern-check suite (comparison signal)
      # --------------------------------------------------------
      - name: "Full compiler test suite"
        continue-on-error: true
        shell: msys2 {0}
        run: python3 devtools/compiler-tests/run.py

      # --------------------------------------------------------
      # Upload all diagnostic artifacts
      # --------------------------------------------------------
      - name: Collect diagnostics
        if: always()
        shell: msys2 {0}
        run: |
          mkdir -p diag_output
          cp /tmp/diag_*.txt diag_output/ 2>/dev/null || true
          cp /tmp/diag_*.log diag_output/ 2>/dev/null || true
          echo "=== Collected files ==="
          ls -la diag_output/ 2>/dev/null || echo "(empty)"

      - name: Upload diagnostics
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: msys2-cproc-diagnostics
          path: diag_output/
