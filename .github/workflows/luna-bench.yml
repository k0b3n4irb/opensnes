name: luna bench

# Nightly anomaly scan of the whole example corpus with luna's own `bench`
# (gaps review R8): crashes, freezes, dead APU, missing firmware — 600 frames
# per ROM, one markdown bug file per finding, uploaded as an artifact. The
# per-push suite asserts what we thought of; this asks luna what it noticed.
# Only a "bug" verdict fails the job; "suspect" (static screen, CPU alive)
# is what most examples look like by design — read the report, do not gate on it.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'   # nightly, 03:00 UTC

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out OpenSNES (with submodules)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Restore prebuilt toolchain
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin
            compiler/cproc
            compiler/qbe
            compiler/wla-dx
          key: toolchain-ubuntu-latest-x86_64-${{ hashFiles('compiler/PINS.md', 'compiler/Makefile', 'compiler/config.h.in', 'compiler/scripts/cc65816') }}

      - name: Stamp cached toolchain up-to-date (cache hit)
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: find bin compiler/cproc compiler/qbe compiler/wla-dx -exec touch {} + 2>/dev/null || true

      - name: Build SDK
        run: |
          export OPENSNES_HOME=$(pwd)
          make

      - name: luna bench
        run: make luna-bench

      - name: Upload the bench report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: luna-bench-report
          path: /tmp/opensnes_bench/
          if-no-files-found: ignore
