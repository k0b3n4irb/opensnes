name: OpenSNES Build & Release

# ------------------------------------ #
# Events to trigger the action         #
# ------------------------------------ #
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "develop"
    tags-ignore:
      - "v*"  # Release tags are handled by release.yml
  pull_request:
    branches:
      - "main"
      - "develop"

# ------------------------------------ #
# Set O.S matrix                       #
# ------------------------------------ #
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            arch: x86_64
          - os: windows-latest
            name: windows
            arch: x86_64
          - os: macos-latest
            name: darwin
            arch: arm64

    steps:
      # ------------------------------------ #
      # Install dependencies                 #
      # ------------------------------------ #
      - name: Install dependencies for Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt update -y
          sudo apt-get install -y build-essential \
              clang \
              cmake \
              make \
              git \
              doxygen \
              zip

      - name: Install dependencies for Windows
        if: matrix.name == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-doxygen
            mingw-w64-ucrt-x86_64-python
            base-devel
            git
            zip

      - name: Install dependencies for macOS
        if: matrix.name == 'darwin'
        run: |
          brew update || true
          brew install doxygen zip || true
          # Xcode Command Line Tools provides the compiler

      # ------------------------------------ #
      # Checkout the project                 #
      # ------------------------------------ #
      - name: Check out OpenSNES
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------ #
      # Verify compiler toolchain pins        #
      # ------------------------------------ #
      # Drift between submodule pointer and compiler/PINS.md fails fast before
      # any build cost. Skipped on Windows because the MSYS2 shell wraps make
      # itself, but the Linux/macOS legs cover the same submodule SHAs.
      - name: Verify compiler toolchain pins
        if: matrix.name != 'windows'
        run: python3 devtools/verify_toolchain.py

      # ------------------------------------ #
      # Build & create release               #
      # ------------------------------------ #
      - name: Build & Release OpenSNES for Linux
        if: matrix.name == 'linux'
        run: |
          export OPENSNES_HOME=$(pwd)
          make release 2>&1 | tee opensnes_release_${{ matrix.name }}.log

      - name: Build & Release OpenSNES for Windows
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: |
          set -o pipefail
          export OPENSNES_HOME=$(pwd)
          # The MSYS2 cproc segfault class is believed FIXED since cproc
          # ea95cac (2026-03-07, mktype uninitialized fields); the make-level
          # retry loop was dismantled 2026-07-04 (it could also mask real
          # build failures). The cc65816-level retry (x3 on exit 139) stays
          # as cheap insurance, with its firings counted below — see
          # KNOWN_LIMITATIONS.md (MSYS2 note).
          export CC65816_RETRY_LOG=$(pwd)/cproc_retries.log
          make release 2>&1 | tee opensnes_release_${{ matrix.name }}.log

      - name: Report cproc segfault-retry count (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: |
          n=0
          [ -f cproc_retries.log ] && n=$(wc -l < cproc_retries.log)
          echo "### cproc segfault retries: $n" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat cproc_retries.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::cproc segfault retry fired $n time(s) — the MSYS2 segfault class may have resurfaced (see KNOWN_LIMITATIONS.md)"
          fi

      - name: Build & Release OpenSNES for macOS
        if: matrix.name == 'darwin'
        run: |
          export OPENSNES_HOME=$(pwd)
          make release 2>&1 | tee opensnes_release_${{ matrix.name }}.log

      # Cooper source-level debug path: a normal build must stay debug-free
      # (byte-identical release codegen), and a CC65816_G=1 build must emit
      # @cline / @dbglocal / the .dbg sidecar. Reuses the toolchain just built.
      - name: Verify Cooper -g debug-info path
        if: matrix.name == 'linux'
        run: |
          export OPENSNES_HOME=$(pwd)
          devtools/check_debug_info.sh

      # ------------------------------------ #
      # Functional tests run in a separate   #
      # job (see `functional-tests` below),  #
      # which runs the luna suite on Linux;  #
      # these per-OS legs are build-only.    #
      # ------------------------------------ #

      # ------------------------------------ #
      # Build and validate examples          #
      # ------------------------------------ #
      - name: Build examples (Linux/macOS)
        if: matrix.name != 'windows'
        run: |
          set -o pipefail
          echo "=== Building Examples ===" | tee -a opensnes_release_${{ matrix.name }}.log
          make examples 2>&1 | tee -a opensnes_release_${{ matrix.name }}.log

      - name: Build examples (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: |
          set -o pipefail
          echo "=== Building Examples ===" | tee -a opensnes_release_${{ matrix.name }}.log
          make examples 2>&1 | tee -a opensnes_release_${{ matrix.name }}.log

      # Validate examples: symmap overlap check on built .sym files
      - name: Validate examples (Linux/macOS)
        if: matrix.name != 'windows'
        run: |
          echo "=== Validating Examples ===" | tee -a opensnes_release_${{ matrix.name }}.log
          found=0
          for sym in $(find examples -name "*.sym" 2>/dev/null); do
            python3 devtools/symmap/symmap.py --check-overlap "$sym" 2>&1 | tee -a opensnes_release_${{ matrix.name }}.log
            found=1
          done
          [ "$found" = "0" ] && echo "No .sym files found (examples not built in CI)" | tee -a opensnes_release_${{ matrix.name }}.log
          true

      - name: Validate examples (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: |
          echo "=== Validating Examples ===" | tee -a opensnes_release_${{ matrix.name }}.log
          found=0
          for sym in $(find examples -name "*.sym" 2>/dev/null); do
            python3 devtools/symmap/symmap.py --check-overlap "$sym" 2>&1 | tee -a opensnes_release_${{ matrix.name }}.log
            found=1
          done
          [ "$found" = "0" ] && echo "No .sym files found (examples not built in CI)" | tee -a opensnes_release_${{ matrix.name }}.log
          true

      # ------------------------------------ #
      # Check library linking                #
      # ------------------------------------ #
      - name: Check library linking (macOS)
        if: matrix.name == 'darwin'
        run: |
          echo "=== Library Linking ===" | tee opensnes_linking_${{ matrix.name }}.log
          otool -L bin/* 2>/dev/null | tee -a opensnes_linking_${{ matrix.name }}.log || true

      - name: Check library linking (Linux)
        if: matrix.name == 'linux'
        run: |
          echo "=== Library Linking ===" | tee opensnes_linking_${{ matrix.name }}.log
          ldd bin/* 2>/dev/null | tee -a opensnes_linking_${{ matrix.name }}.log || true

      - name: Check library linking (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: |
          echo "=== Library Linking ===" | tee opensnes_linking_${{ matrix.name }}.log
          ldd bin/*.exe 2>/dev/null | tee -a opensnes_linking_${{ matrix.name }}.log || true

      # ------------------------------------ #
      # Upload SDK release                   #
      # ------------------------------------ #
      - name: Upload OpenSNES SDK release
        uses: actions/upload-artifact@v4
        with:
          name: OpenSNES SDK (${{ matrix.name }}_${{ matrix.arch }})
          path: release/opensnes_${{ matrix.name }}_${{ matrix.arch }}.zip

      # ------------------------------------ #
      # Upload build logs                    #
      # ------------------------------------ #
      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenSNES Logs (${{ matrix.name }})
          path: "*.log"
  # ====================================================================== #
  # Functional tests via luna (cycle-accurate native emulator)             #
  #                                                                        #
  # Replaces the snes9x-WASM + Mesen2 harness with ONE pinned native luna  #
  # binary — no emsdk / WASM build / Node / Mesen2 / xvfb / ubuntu-22.04   #
  # pin. luna runs SA-1 / SuperFX natively, so there is no chip-ROM side   #
  # channel. Runs: corpus liveness, visual regression, functional probes.  #
  # ====================================================================== #
  functional-tests:
    name: Functional Tests (luna, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          # linux/arm64 is a SHIPPED release artifact (release.yml builds
          # opensnes_*_linux_arm64.zip) — it must execute ROMs in CI too,
          # not just compile. Baselines are captured on aarch64, so the
          # fbhash comparison is native here.
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out OpenSNES (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify compiler toolchain pins
        run: python3 devtools/verify_toolchain.py

      - name: Build SDK (toolchain + lib + examples)
        run: |
          export OPENSNES_HOME=$(pwd)
          make

      - name: Compiler C→ASM pattern checks
        run: python3 devtools/compiler-tests/run.py

      - name: Compiler cycle-count benchmark
        run: python3 devtools/cyclecount/bench.py

      - name: Install luna (pinned binary)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-luna.sh

      - name: A7 32-bit runtime correctness
        # Builds the s32/u32 fixture ROM and asserts its WRAM results via luna.
        # Runtime gate the static C→ASM checks can't provide (they pass even on
        # broken 32-bit codegen — see chantier A7 Phase 0/1).
        run: |
          make -s -C devtools/compiler-tests/runtime/a7_32bit
          python3 devtools/compiler-tests/runtime/a7_32bit/test_a7_32bit.py

      - name: A6 far-pointer runtime matrix
        # xfail-tolerant gate over the far-deref matrix (storage form × bank).
        # Fails ONLY on a regression of an expected-green cell; the remaining
        # A6 word/phi gaps are tracked in KNOWN_FAIL inside the test.
        run: |
          make -s -C devtools/compiler-tests/runtime/a6_farptr
          python3 devtools/compiler-tests/runtime/a6_farptr/test_a6_farptr.py

      - name: Lib runtime assertions (libtest)
        # Executes lib/source functions with known vectors and asserts the WRAM
        # results — the execution gate the library lacks (examples exercise it
        # only transitively; the visual hash can't see a wrong return value).
        run: |
          make -s -C devtools/libtests
          python3 devtools/libtests/test_libtest.py

      - name: Corpus liveness coverage
        run: python3 tools/luna-test/luna_runner.py --coverage

      - name: Functional probes
        run: python3 tools/luna-test/probes/run_all.py

      - name: Visual regression
        # Keyed on luna's `--print-fbhash` (a hash of the pre-PNG pixels luna
        # documents as cross-architecture-stable), so aarch64-captured baselines
        # are expected to match on this x86_64 runner — the step is blocking.
        # (If a luna release ever breaks fbhash cross-arch, that's a luna bug;
        # regenerate baselines with `luna_runner.py --update` meanwhile.)
        run: python3 tools/luna-test/luna_runner.py --compare

      - name: WRAM-state regression (54/56, cross-arch exclusions)
        # Per-frame WRAM oracle — catches runtime-state regressions that never
        # reach the screen (uninitialised reads, mis-stepped counters). The two
        # examples whose WRAM stream is arch-dependent (mapandobjects,
        # slopemario) are skipped by CROSS_ARCH_EXCLUDE in the runner; the
        # other 54 gate both arches. Rebaseline after an intentional change:
        # `python3 tools/luna-test/wram_regress.py --update` (same commit).
        run: python3 tools/luna-test/wram_regress.py

      - name: Upload luna artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: luna-test artifacts
          path: |
            tools/luna-test/baselines/
            /tmp/luna-test-actual/
            /tmp/luna-test-corpus/
