name: Lint

# Mechanical enforcement of policies in .claude/rules/.
#
# Three kinds of job:
#   lint            — `make lint`, verbatim: the aggregate every contributor runs
#                     before a PR (doc drift, ASM markers, lib rodata, bank-read
#                     self-test, corpus freshness, ASM ABI, VRAM layout, commit
#                     messages, cppcheck). Add a new linter to the Makefile target, never
#                     to this file — a hand-listed subset here diverged from the
#                     Makefile twice (three linters were CI-blind on 2026-09-11).
#   devtools-tests  — the unit tests OF the linters (they exercise the parsers
#                     against synthetic fixtures so a rule can't silently rot).
#   tools-golden / doc-render — checks that need a built tool or Doxygen.
#   sanitizers      — `make test-sanitizers`: the host toolchain (cproc-qbe,
#                     QBE, wla-dx) and the asset tools rebuilt with ASan +
#                     UBSan, then run over the fixtures, the lib, the goldens,
#                     the corpus and the submodules' own upstream suites (H1,
#                     make test-toolchain-suites). Its first run found seven latent bugs
#                     (2026-09-12); it is the one job here that builds the
#                     compiler, and it must stay the only one.
# Keep the other jobs free of the toolchain build so quick checks stay fast.

on:
  pull_request:
    branches:
      - "main"
      - "develop"
  push:
    branches:
      - "main"
      - "develop"

# Dedup the push+PR double-fire (see opensnes_build.yml for the rationale):
# push and PR of the same branch head share a group, newer cancels older.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: make lint (the contributor gate, verbatim)
    runs-on: ubuntu-latest
    steps:
      - name: Check out OpenSNES (full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # lint-commits walks a commit range

      - name: Determine commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            echo "range=${BASE}..${HEAD}" >> "$GITHUB_OUTPUT"
          else
            # On push, check commits in this push (before..after).
            # github.event.before may be all-zeros on a new branch, OR it may
            # point to a now-dangling commit after a force-push (the old tip
            # is no longer reachable from the new tip and was not fetched by
            # actions/checkout). In both cases, fall back to comparing against
            # origin/main, which catches everything that's newly landing on
            # this branch.
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
                 || [ -z "$BEFORE" ] \
                 || ! git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null; then
              echo "range=origin/main..HEAD" >> "$GITHUB_OUTPUT"
            else
              echo "range=${BEFORE}..HEAD" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install cppcheck
        # `make lint` runs lint-cppcheck (gaps review H4): the asset tools'
        # sources and the lib's C, vendored decoders suppressed. The target
        # skips itself where cppcheck is absent; here it must gate.
        run: sudo apt-get install -y -qq cppcheck >/dev/null && cppcheck --version

      - name: make lint
        # No build here: check_corpus_fresh.py passes trivially on a tree with
        # no lib outputs (it guards built corpora; the built one is checked by
        # `make tests` in opensnes_build.yml). Everything else in the target
        # reads sources only.
        run: make lint RANGE="${{ steps.range.outputs.range }}"

  devtools-tests:
    name: Linter unit tests (devtools)
    runs-on: ubuntu-latest
    steps:
      - name: Check out OpenSNES
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: test_check_doc_drift
        # Phantom-API detector and example-count patterns of the doc-drift
        # sentinel (must match real phrasings, must NOT match prose like
        # "12 examples were flagged").
        working-directory: devtools
        run: python3 -m unittest test_check_doc_drift

      - name: test_check_nmi_wram_race
        # Parser logic (call-graph + callback detection + closure) of the
        # NMI→$2180-$2183 lint that runs per-example in make/common.mk.
        run: python3 devtools/test_check_nmi_wram_race.py

      - name: test_symmap
        # Pins the WRAM-overlap detector's verdict against committed .sym
        # fixtures (a broken one must fail, a clean one must pass).
        run: python3 devtools/symmap/test_symmap.py

      - name: test_check_vram_layout
        working-directory: devtools
        run: python3 -m unittest test_check_vram_layout

      - name: test_asset_budget
        # Script-style runner (its own main, not unittest). Was orphaned (no
        # Makefile target, no workflow) until 2026-09-11.
        run: python3 devtools/test_asset_budget.py

  tools-golden:
    name: Asset-tool golden outputs (make test-tools)
    runs-on: ubuntu-latest
    steps:
      - name: Check out OpenSNES (with submodules)
        # `make tools` runs the top-level verify-toolchain dependency, which
        # needs the compiler submodules checked out.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Build asset tools
        run: make tools

      - name: Run golden-output tests
        # Byte-compares every asset tool's output against committed goldens
        # (gfx4snes, tmx2snes, smconv, wav2brr, palplan, aseprite2snes,
        # font2snes, img2snes). These converters feed the examples' assets; a
        # silent regression here used to surface only as an unlocalised
        # visual-hash churn downstream. The target is the contract — a
        # hand-listed pair here was CI-blind to six tools until 2026-09-14.
        run: make test-tools

  sanitizers:
    name: Host toolchain under ASan + UBSan (make test-sanitizers)
    runs-on: ubuntu-latest
    steps:
      - name: Check out OpenSNES (with submodules)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: make test-sanitizers
        # Rebuilds the compiler and the tools with -fsanitize=address,undefined
        # (SANITIZE=1 drops -static: the sanitizer runtimes do not link
        # statically) and runs the compiler fixtures, `make lib`, `make
        # test-tools`, `make examples` and the cproc / QBE / wla-dx upstream
        # suites (make test-toolchain-suites) under halt_on_error=1 — any
        # report is a failure. Nothing here runs a ROM, so no luna. Replaces the
        # non-gating Windows-only UBSan step that msys2_cproc_diagnostic.yml
        # carried until 2026-09-12 (ASan has no MinGW runtime; this job has
        # both and gates).
        run: make test-sanitizers

  host-coverage:
    name: Compiler host coverage (make coverage-host)
    runs-on: ubuntu-latest
    steps:
      - name: Check out OpenSNES (with submodules)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Install llvm-cov
        run: sudo apt-get update -qq && sudo apt-get install -y -qq llvm

      - name: make coverage-host
        # QBE and cproc-qbe rebuilt with clang source-based coverage, the
        # compiler fixtures and the lib build run through them, llvm-cov
        # line/function/region report for the fork-owned files (w65816
        # backend, cproc target side) and the whole tree. A report, not a
        # gate (gaps review H7): the artifact is the map of what the
        # fixtures never reach; a ratchet comes once the number is known.
        run: make coverage-host

      - name: Upload the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-coverage
          path: |
            /tmp/opensnes_coverage/report_all.txt
            /tmp/opensnes_coverage/report_fork.txt
            /tmp/opensnes_coverage/coverage.lcov

  doc-render:
    name: Doc render leaks (check_doc_render.py)
    runs-on: ubuntu-latest
    steps:
      - name: Check out OpenSNES (with submodules)
        # docs/doxygen-awesome-css is a submodule and the Doxyfile lists its
        # stylesheets in HTML_EXTRA_STYLESHEET / HTML_EXTRA_FILES. Doxygen
        # only warned about the missing files until WARN_AS_ERROR went on
        # (gaps review P7) — now their absence fails the build, as it should.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - name: Install Doxygen 1.16.1 (pinned — must match deploy_docs.yml)
        # ubuntu's Doxygen 1.9.8 has a severe Markdown bug; the guard must test
        # the SAME version that publishes the docs, so it pins 1.16.1 too.
        # Fetched from the official GitHub release (doxygen.nl 403s GitHub
        # runners) and SHA-256-verified, same pattern as install-luna.sh.
        run: |
          curl -fsSL -o /tmp/doxygen.tgz https://github.com/doxygen/doxygen/releases/download/Release_1_16_1/doxygen-1.16.1.linux.bin.tar.gz
          echo "a56f885d37e3aae08a99f638d17bbb381224c03a878d9e2dda4f9fa4baf1d8bd  /tmp/doxygen.tgz" | sha256sum -c -
          tar xzf /tmp/doxygen.tgz -C /tmp
          sudo cp /tmp/doxygen-1.16.1/bin/* /usr/local/bin/
          doxygen --version

      - name: Build docs + scan for un-rendered Markdown
        # Doxygen mangles an inline `code` span placed inside an ASCII "..." quote:
        # it leaks into the page as a literal &lt;tt&gt; tag (when the line wraps)
        # or as raw backticks (single line). A source-side regex can't tell "code
        # inside a quote" from "code between two quotes", so we build the HTML and
        # scan the rendered output (zero false positives). Caught historically as
        # `<tt>WH0</tt>`-style literals across the window/hdma/math/sram tutorials.
        run: |
          make docs-strict
          python3 devtools/check_doc_render.py
