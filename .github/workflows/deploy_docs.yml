name: Deploy Documentation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Doxygen 1.16.1 (pinned)
        # ubuntu-latest ships Doxygen 1.9.8, whose Markdown parser mangles inline
        # code/emphasis spans inside "..." quotes across the tutorials (literal
        # <tt>/<em> tags leak into the published pages). 1.16.1 renders cleanly.
        # Fetched from the official GitHub release (doxygen.nl 403s GitHub
        # runners) and SHA-256-verified, same pattern as install-luna.sh.
        run: |
          curl -fsSL -o /tmp/doxygen.tgz https://github.com/doxygen/doxygen/releases/download/Release_1_16_1/doxygen-1.16.1.linux.bin.tar.gz
          echo "a56f885d37e3aae08a99f638d17bbb381224c03a878d9e2dda4f9fa4baf1d8bd  /tmp/doxygen.tgz" | sha256sum -c -
          tar xzf /tmp/doxygen.tgz -C /tmp
          sudo cp /tmp/doxygen-1.16.1/bin/* /usr/local/bin/
          doxygen --version

      - name: Build documentation
        run: cd docs && doxygen Doxyfile

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
