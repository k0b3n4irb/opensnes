# continuous_scroll — the threshold camera: Kit runs, and what he goes past
# a threshold the world scrolls instead, BG2 at half BG1's speed. Nothing
# moves without input, so no other test runs any of it.
#
# What this proves that the other pillars cannot (all values follow from
# main.c's loop; game = s16 player_x, player_y, bg1 x, bg1 y, bg2 x, bg2 y,
# `game` read at width 2 is player_x):
#   * RIGHT held from 60: +2 px/frame up to the threshold, 20 -> 140 at
#     frame 120, with no scroll yet (the test is player_x > 140).
#   * Past it, Kit stays at 140 and BG1 scrolls 2 px/frame, BG2 1. At 200:
#     scroll 160 and 80 in RAM; the registers run one frame behind
#     (bgSetScroll defers the write to the NMI): 158 and 79. BGnVOFS = 7
#     and 239 are the lib's y - 1 for y = 8 and 240.
#   * The clamp: BG1 stops at MAX_SCROLL_X = 256 (frame 248, BG2 128), then
#     Kit runs on to 216; still held, nothing more moves.
#   * LEFT held 500..699: -2 px/frame to the left threshold 80 (frame 568),
#     then the scroll goes back 2/frame (192 / 96 at 600, registers 194 /
#     97), to 0 at frame 696, and Kit walks on to 72.
#   * Released at 700: nothing moves.
#
# Measured on luna v1.40.0: `luna state --until-frame N --input "60:0x0100,
# 500:0x0200,700:0" --peek game:C --out -` (+ ppu.bgs.N.h_scroll / v_scroll)
# at 120/121/200/250/300/500/600/700/760.
rom = "../../examples/scrolling/continuous_scroll/continuous_scroll.sfc"

[[checkpoint]]                 # RIGHT 60..119: +2/frame, below the threshold
at_frame = 120
input = "60:0x0100"
[checkpoint.values]
game = { eq = 140, width = 2 }
[checkpoint.ppu]
"bgs.0.h_scroll" = 0

[[checkpoint]]                 # past it: Kit stays, the world scrolls, BG2 at half speed
at_frame = 200
[checkpoint.values]
game = { eq = 140, width = 2 }
[checkpoint.ppu]
"bgs.0.h_scroll" = 158         # one frame behind the 160 in RAM
"bgs.1.h_scroll" = 79          # half of BG1's
"bgs.0.v_scroll" = 7           # y 8 written as y - 1
"bgs.1.v_scroll" = 239         # y 240 (-16) written as y - 1

[[checkpoint]]                 # the clamp: scroll 256, Kit runs on to 216
at_frame = 300
[checkpoint.values]
game = { eq = 216, width = 2 }
[checkpoint.ppu]
"bgs.0.h_scroll" = 256
"bgs.1.h_scroll" = 128

[[checkpoint]]                 # still held: nothing moves past the clamps
at_frame = 500
input = "500:0x0200"
[checkpoint.delta]
game = { dir = "unchanged", width = 2 }
[checkpoint.ppu]
"bgs.0.h_scroll" = 256

[[checkpoint]]                 # LEFT: to the threshold 80, then the world scrolls back
at_frame = 600
[checkpoint.values]
game = { eq = 80, width = 2 }
[checkpoint.ppu]
"bgs.0.h_scroll" = 194
"bgs.1.h_scroll" = 97

[[checkpoint]]                 # back to the start: Kit walks on to 72, then is released
at_frame = 760
input = "700:0"
[checkpoint.values]
game = { eq = 72, width = 2 }
[checkpoint.ppu]
"bgs.0.h_scroll" = 0
"bgs.1.h_scroll" = 0

[asserts.blocks]               # 72, 105, 0, 8, 0, 240
game = "48006900000008000000f000"
