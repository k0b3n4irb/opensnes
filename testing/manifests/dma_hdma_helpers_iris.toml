# hdma_helpers: the colour gradient (B) and the iris (X, then UP to re-call it)
# reach the screen. The example keeps channel 6 enabled on BG1HOFS with an
# empty table between effects; from 2026-10-03 to 2026-10-19 an effect that
# found its channel enabled only moved the table pointer, so the gradient's
# and the iris's tables went to BG1HOFS and nothing was drawn, while
# dma_hdma_helpers_effects.toml (state and window registers) kept passing.
# The registers cannot show a table sent to the wrong register; the frame
# can. Measured with the fix; the build without it gives another hash.
rom = "../../examples/hdma/hdma_helpers/hdma_helpers.sfc"
frames = 200
input = "60:0x8000,64:0,100:0x0040,104:0,140:0x0800,144:0"

[asserts]
fbhash = "7d2435b35b4c638f"     # the iris, re-called by UP at radius 90

[asserts.values]
fx = { eq = 3, width = 1 }
