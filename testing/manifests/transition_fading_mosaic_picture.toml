# The picture of a mosaic, which nothing else looks at: transition_fading.toml
# pins the lib's shadow of $2106 through the four transitions and ends with
# the mosaic off, and the corpus fbhash sees the idle screen at size 0. So a
# change in how the blocks are drawn passed every oracle: luna v1.33.0 moved
# the mosaic grid down one line (its blocks started one line too high, fixed
# against ares and Mesen2) and none of our baselines noticed (2026-10-06).
#
# Same script as transition_fading.toml up to the press that starts the
# mosaic, stopped where mosaicFadeOut(3) has reached and holds MOSAIC_MAX:
# the frame hashed is BG1 in 16x16 blocks. (Written for the mosaic example,
# moved to fading with it on 2026-10-18: same picture, same hash; the picture
# became the moon over the skyline on 2026-10-21, hash re-taken on luna
# v1.40.0.) Negative control on the day it was written: luna v1.32.0
# gives another hash for this frame (b40b834549507f25) and fails this manifest,
# while the corpus hashes and the mosaic legs were the same on both.
rom = "../../examples/transitions/fading/fading.sfc"

[[checkpoint]]                 # the six fades: fast, slow, very slow; back to full brightness
at_frame = 520
input = "60:0x0080,64:0,100:0x0080,104:0,140:0x0080,144:0,220:0x0080,224:0,300:0x0080,304:0,420:0x0080,424:0"
[checkpoint.values]
console_brightness = { eq = 15, width = 1 }
mosaic_size = { eq = 0, width = 1 }

[[checkpoint]]                 # mosaicFadeOut(3) complete and held
at_frame = 590
input = "540:0x0080,544:0"
[checkpoint.values]
mosaic_size = { eq = 15, width = 1 }
mosaic_bg_mask = { eq = 1, width = 1 }
console_brightness = { eq = 15, width = 1 }

[asserts]
fbhash = "08dabbb8b15e5725"
