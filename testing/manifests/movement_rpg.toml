# The RPG boots into ST_FADEIN (0) and only reaches ST_EXPLORE (1) once
# fade_level hits 30, so leg 1 pins the fade state and leg 2 pins the
# transition — plus the negative that matters during a fade: the hero
# must not move while the game is not yet accepting input.
#
# Movement is metatile-locked (16 px, two map cells): begin_step() only
# commits if the four cells of the metatile ahead are walkable and no
# resident stands there, then slides 2 px per frame for 8 frames (9 frames
# a step, counting the one that starts it). Each hold is released a few
# frames before its checkpoint so the step in flight has landed.
#   * LEFT from the spawn, metatile (11, 9) of the street: 5 steps west,
#     176 - 5 * 16 = 96;
#   * DOWN: 4 steps to the sidewalk's last row, 144 + 4 * 16 = 208, and the
#     fifth is refused — the apartment block's wall (the negative);
#   * UP one metatile (the foot of a lamp post blocks the last row further
#     east), then RIGHT along the sidewalk: 11 steps to x 272, the lockers
#     stop the twelfth; A facing them opens them: 10 credits, the dialog box.
# hero_facing proves the direction reached the state machine; gold stays 0
# until the lockers, so a ROM that handed credits out without a press of A
# in front of them fails the earlier legs.
rom = "../../examples/demos/rpg/rpg.sfc"

[[checkpoint]]                 # fading in
at_frame = 30
[checkpoint.values]
game_state = { eq = 0, width = 1 }       # ST_FADEIN
hero_x = 176
hero_y = 144
hero_facing = { eq = 0, width = 1 }      # FACE_DOWN (spawn facing)
gold = 0

[[checkpoint]]                 # fade done -> ST_EXPLORE, hero untouched by it
at_frame = 90
[checkpoint.values]
game_state = { eq = 1, width = 1 }       # ST_EXPLORE
hero_x = 176
hero_y = 144
gold = 0

[[checkpoint]]                 # LEFT: 5 metatiles west along the street
at_frame = 150
input = "90:0x0200,134:0"
[checkpoint.values]
hero_x = 96                              # 176 - 5*16
hero_y = 144                             # vertical axis untouched
hero_facing = { eq = 2, width = 1 }      # FACE_LEFT
gold = 0

[[checkpoint]]                 # DOWN: 4 metatiles, then the wall
at_frame = 205
input = "150:0x0400,199:0"
[checkpoint.values]
hero_x = 96
hero_y = 208                             # 144 + 4*16: the fifth step is refused
hero_facing = { eq = 0, width = 1 }      # FACE_DOWN
gold = 0
chest_opened = { eq = 0, width = 1 }

[[checkpoint]]                 # UP one, RIGHT to the lockers, then A: 10 credits
at_frame = 340
input = "205:0x0800,210:0,216:0x0100,315:0,320:0x0080,322:0"
[checkpoint.values]
hero_x = 272                             # 96 + 11*16: the lockers stop the twelfth
hero_y = 192                             # 208 - 16
hero_facing = { eq = 3, width = 1 }      # FACE_RIGHT
gold = 10
chest_opened = { eq = 1, width = 1 }
game_state = { eq = 2, width = 1 }       # ST_DIALOG

# Every VRAM DMA of this input-driven run lands in blank or forced blank
# (vram_dma_blank.py only sees the boot path; the gate for what a button
# press triggers is here, one manifest at a time).
[asserts.dma]
unsafe_writes = 0
