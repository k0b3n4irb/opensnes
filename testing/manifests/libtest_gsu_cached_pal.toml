# The same fixture under PAL (312 lines, 50 Hz): gsu_pres_vtotal = 312 is the
# path isPAL() selects in gsuPresentInit, and every frame still lands (chips
# audit PF5, 2026-10-05). The job-duration counts below are in PAL frames.
# Super FX, a job run from the GSU code cache while the game keeps running
# (gsuCacheLoad / gsuStartCached / gsuBusy / gsuWait, 2026-09-27).
#
# What this proves that the other pillars cannot:
#   * gsuStartCached() returns at once: gsuBusy() reads 1 right after it.
#   * The game runs during the job: the fixture's main loop waits for VBlank
#     from ROM while the GSU adds 7 six hundred thousand times, and counts
#     7 frames before gsuBusy() drops. gsuLaunch() parks the CPU in WRAM for
#     the whole job instead.
#   * The ROM stays the CPU's: bus_violations = 0. Negative control (RON set
#     back to 1 right after the start, the rest unchanged): 149 340
#     violations, the loop stuck at 1 frame, 26 NMIs instead of 58.
#   * The job's result reaches the CPU after gsuWait(): the sum of the loop,
#     200 x 3000 x 7 mod 65536 = $1640, in Game Pak RAM $70:0000.
#   * The job's last store reaches RAM: the $C0DE marker, written by an
#     STW followed by a single NOP and STOP. From the cache those take
#     6, 1, 1 GSU clocks, less than the RAM buffer needs to write the
#     second byte (5-6 clocks); luna before v1.28.1 stopped clocking the
#     buffer at STOP and lost it ($00DE), a console does not (luna's reply
#     of 2026-09-27, after ares superfx.cpp).
#   * IRQ on STOP (2026-09-27): the same job again with CFGR bit 7 clear
#     and the I flag clear (a V-timer IRQ armed, as a game has one).
#     crt0's WRAM IRQ entry acknowledges the GSU (SFR bit 15) and counts it
#     in gsu_stop_irqs: the loop waits on that counter, 7 frames, the count
#     moves by exactly 1, the GSU is stopped when it does. Negative control
#     (crt0 before the fix, IRQ passed to IrqHandler): the CPU never leaves
#     its IRQ entry (PC $7E:205D at frame 60), r_done stays 0.
#   * A job run from ROM (RON = 1) while the CPU keeps working (2026-09-29):
#     the wait loop is in the RAM code window (RAM_CODE_SIZE = 256,
#     ram_job.asm, RAM_CODE_SECTION), linked at $7E:FF01 and copied there
#     by crt0. Game Pak RAM is cleared first, so r_sum / r_marker come from
#     this third job. 33 frames counted by the NMI during the job, 53 270
#     polls, bus_violations still 0. Negative control (the same loop in a
#     plain ROM section): 497 475 violations, the CPU lost at $00:0102, the
#     NMI dead at frame 100, r_done never written.
#   * The same ROM job a fourth time, the wait loop written in C with
#     RAM_CODE (main.c ram_c_rom_job; 2026-09-29): no call in its code, so
#     no ROM fetch while RON = 1. 34 frames, 20 588 polls, results
#     rewritten. Negative control, the same function without RAM_CODE:
#     49 585 violations, the CPU lost at $00:0100, r_done never written.
#   * A second entry point, by name (2026-09-29): the build writes
#     gsu_job.sfx.h from the GSU link (GSU_JOB_MUL_JOB = 0x28), main.c
#     passes R1 / R2 and starts mul_job with gsuCall() from ROM (300 x 7)
#     and gsuStartCached() from the cache (1000 x 9). Game Pak RAM is
#     cleared before each run.
#
# Measured: `luna state --until-frame 150 --peek <sym>:2 --out -` on
# testing/fixtures/libtests_gsu/libtest_gsu.sfc, luna v1.28.1.
rom = "../fixtures/libtests_gsu/libtest_gsu.sfc"
frames = 400
region = "pal"

[asserts.values]
r_present = 1
r_busy_after_start = 1
r_frames_during = 6         # PAL: the same job spans 6 of its longer frames (7 under NTSC)
r_busy_after_wait = 0
r_sum = 0x1640
r_outer = 0
r_marker = 0xC0DE
r_frames_during_irq = 6     # idem
r_stop_irqs_before = 0
r_stop_irqs_delta = 1
r_busy_at_irq = 0
r_ram_frames = { ge = 25, le = 45 }
r_ram_polls = { gt = 1000 }
r_c_frames = { ge = 25, le = 45 }
r_c_polls = { gt = 1000 }
r_mul_entry = 0x28
r_mul_rom = 2100
r_mul_cache = 9000
r_prog_addr = 0x8000      # GSU_BANK := 1: the program is at $01:8000 ...
r_prog_bank = 1
r_boot_save = 0           # no .srm given: the save region powers on empty
r_save_idle = 0           # SRAM_OK
r_save_rt = 1
r_save_busy = 1           # a cached job is running, RAN = 1 ...
r_save_busy_rc = 0
r_save_busy_rt = 1        # ... and the save still lands and reads back
r_save_still = 1          # ... without ending the job
r_save_job = 1            # ... which finishes with its results ($C0DE, $1640)
r_save_range = 1          # SRAM_ERR_RANGE: 0xFFF8 + 16 wraps past 64 KB
r_rom_table = 0x3CA5      # ... so its table and its absolute jump are where it was assembled for
r_launch_frames = { ge = 25, le = 45 }   # fifth job: gsuLaunch() parks the CPU in WRAM, the NMI blob keeps counting (34 measured, the ROM-run pace)
r_launch_job = 1          # ... and the job ends with its results
r_present_init = 1        # gsuPresentInit(0x0000, 0x2000, 0) accepted (2bpp x 128 lines: 8 KB buffers)
r_present_busy = 1        # a frame in flight right after gsuPresent()
r_present_done = 1        # landed after gsuPresentWait()
r_present_scbr = 8        # gsu_scbr flipped to buffer B: 8 KB = 8 x 1 KB
# The geometry and presentation paths no ROM ran (chips audit PF5, 2026-10-05):
r_fb_h128_2bpp = 8192     # gsuFrameBytes: 16 rows x 16 bytes x 32 columns
r_fb_h160_2bpp = 10240    # SCMR_H160: 20 rows
r_fb_h192_2bpp = 12288    # SCMR_H192: 24 rows
r_fb_h192_4bpp = 24576    # 4bpp tiles are 32 bytes
r_fb_h192_8bpp = 49152    # 8bpp, 64 bytes
r_fb_obj = 0              # HT0 + HT1 is OBJ mode: no framebuffer
r_init_too_big = 0        # two 48 KB frames do not fit the 64 KB of Game Pak RAM: refused
r_init_h160 = 1           # a 160-line 2bpp frame accepted at $4000 / $6000
r_h160_scbr = 18          # gsu_scbr flipped by 10 KB (8 + 10)
r_nolag_busy = 1          # flags 0: the frame stays in flight while the main thread never parks (30 frames)
r_lag_done = 1            # GSU_PRESENT_ON_LAG_FRAMES: the NMI moved it on those lag frames
r_save_pres_busy = 1      # a frame was in flight when sramSaveOffset ran...
r_save_pres_rc = 0        # ...the save succeeded...
r_save_pres_rt = 1        # ...and reads back
r_done = 0xD0E5

[asserts.blocks]
gsu_hdma_table = "7F0F110F508000"   # gsuSetupHdmaBlanking(0, 80): [127 show][17 show][80 blank] end — no empty top entry
# the presented buffer A (its first six bytes are the job's results: sum, outer, marker) lands
# in the BACK char block, vram_b = word 0x2000 = byte 0x4000; BG12NBA then flips to it
presented_frame = { space = "vram", offset = "4000", hex = "40160000DEC0" }
# the 160-line frame: its last byte (A5, written to $70:2000 + 10239) lands at
# byte $E7FF of the $6000-word block, and the byte after it ($5A in RAM) does not move
h160_last  = { space = "vram", offset = "E7FF", hex = "A5" }
h160_after = { space = "vram", offset = "E800", hex = "00" }

[asserts.gsu]
cfgr = 0x80               # the last job asked $A0 (MS0): dropped at 21 MHz
bus_violations = 0
instructions_executed = { gt = 2000000 }   # four jobs of 600 000 loop iterations x 4 instructions
