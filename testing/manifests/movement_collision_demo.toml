# Migrated from probes/movement.py (luna#205 [[checkpoint]]/delta). Pressing a
# direction moves the world coordinate the expected way. Baseline settles, then
# each leg holds a direction and asserts the delta vs the previous checkpoint.
rom = "../../examples/basics/collision_demo/collision_demo.sfc"
frames = 180

[[checkpoint]]              # baseline
at_frame = 60
[checkpoint.values]
"player_x.main" = { eq = 120, width = 2 }
"player_y.main" = { eq = 112, width = 2 }
[[checkpoint]]             # hold RIGHT -> player_x increases
at_frame = 120
input = "60:0x0100,119:0"
[checkpoint.delta]
"player_x.main" = "increased"
[checkpoint.values]
"player_x.main" = { eq = 176, width = 2 }
"player_y.main" = { eq = 112, width = 2 }
[[checkpoint]]             # hold DOWN -> player_y increases
at_frame = 180
input = "120:0x0400,179:0"
[checkpoint.delta]
"player_y.main" = "increased"

# Every VRAM DMA of this input-driven run lands in blank or forced blank
# (added 2026-10-04: vram_dma_blank.py only sees the boot path; the gate for
# what a button press triggers is here, one manifest at a time).
[checkpoint.values]
"player_x.main" = { eq = 176, width = 2 }
"player_y.main" = { eq = 152, width = 2 }
[asserts.dma]
unsafe_writes = 0
# Measured values and the image after the whole script (testing audit T7/T10, 2026-10-05):
# the square walks one pixel per frame and stops at the wall: 120 -> 176 (right wall), 112 -> 152.
[asserts]
fbhash = "39b4d33362dc3375"
