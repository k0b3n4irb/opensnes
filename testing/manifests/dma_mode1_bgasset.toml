# backgrounds/mode1 — the typed BgAsset bundle lands where the call says.
#
# This example's whole point is `bgLoad(0, &street, 0, 0x0000, 0x7800)`: ONE
# call that must fan out into three transfers — tiles to VRAM word $0000,
# tilemap to VRAM word $7800, palette to CGRAM slot 0 — with the colour depth
# and map size (BG_16COLORS / SC_32x32) taken from the DECLARE_BG_ASSET
# declaration rather than from the call site. The three blocks below are those
# three destinations, addressed in bytes (VRAM byte = word * 2, so word $7800
# is byte $F000). The picture is the rainy street (883 tiles) since
# 2026-10-19.
#
# Why liveness/fbhash would not catch a failure here: bgLoad() is the only
# consumer of the BgAsset struct layout, so a field-order slip (tiles/map
# pointers swapped, a stale `_end` label) shows up as "the screen looks
# different" — which the fbhash pillar reports as an unexplained hash and the
# next `--update` silently blesses. These blocks say WHICH of the three
# transfers went wrong, and they are the same bytes dma_mode1_lz.toml asserts
# for the decompressed copy at $4000, so the two paths are pinned to one
# source of truth.
rom = "../../examples/backgrounds/mode1/mode1.sfc"
frames = 200

[asserts.blocks]
bg_pal_slot0  = { space = "cgram", offset = "0000", hex = "de2a89525c49c63d442d0c41e320c424b430a31c621421080000000000000000" }
bg_map_w7800  = { space = "vram",  offset = "F300", hex = "7f018001810182018301840185018601" }
bg_tiles_w0000 = { space = "vram", offset = "0C80", hex = "070407040704030003000300030001000007000700072403a003a003a003a001" }

# Every VRAM/CGRAM transfer in this example happens once, at boot, under force
# blank; nothing is uploaded per frame. `unsafe_writes = 0` is that invariant —
# the project's first silent failure ("VRAM writes only work during VBlank or
# forced blank"). No `max_vblank_bytes` ceiling: measured VBlank traffic is 0,
# so a ceiling over it would assert nothing.
[asserts.dma]
unsafe_writes = 0
