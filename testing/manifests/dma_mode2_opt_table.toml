# backgrounds/mode2 — the offset-per-tile table, as the PPU will read it.
#
# In Mode 2 BG3 is not a picture, it is an offset table: per screen column the
# PPU reads BG3 tile-row 0 for the H offset word and tile-row 1 for the V
# offset word. The example writes only V words, each carrying the 0x2000 bit
# that says "apply to BG1". BG3's map is at word $3000, so row 0 is VRAM byte
# $6000 (32 words = 64 bytes) and row 1 is byte $6040.
#
# The row-1 words are the whole example in 64 bytes: every word's high byte
# is 0x20 (the BG1-enable bit) and the low bits walk a sine. The README lists
# the three ways this goes wrong, and each is a distinct failure of this one
# block:
#   * "bands stay flat"          -> the row is zeros; the DMA missed VBlank.
#   * "whole layer shifts"       -> high bytes are 0x00; the 0x2000 bit is gone.
#   * "only column 0 is wrong"   -> hardware, not a bug; the block still passes.
# The row-0 words are the negative: this example writes NO horizontal
# offsets, so row 0 must stay exactly zero for the whole run.
#
# `unsafe_writes = 0` is the assert that matches the README's own warning
# verbatim: the offset table is built during ACTIVE display and DMA'd the
# instant VBlank starts, because computing it after WaitForVBlank() pushes the
# transfer past VBlank's end and the PPU silently drops it. A regression that
# reorders those two lines is invisible to every other pillar — the ROM still
# runs, still animates its counter, and the bands just stop rippling.
#
# The BG1 side is asserted with two self-evident blocks: the example builds 16
# solid tiles where tile N is uniformly colour N, so tile 3 (0b0011) must be
# bitplanes 0+1 set and 2+3 clear, tile 12 (0b1100) the exact mirror. The map
# rows are "tile = row & 15", so map row 3 is 32 copies of tile 3.
#
# Since the Mode 4 scene joined this example (2026-10-18, backgrounds/mode4
# merged into it), the boot builds both scenes and lasts 15 frames longer:
# the checks are taken at the 192nd arrival at WaitForVBlank instead of
# frame 199 — the same loop iteration, so the same words as before
# (wave_phase 384, 192 iterations of +2). The offset rows are asserted word
# by word, as `vram:` values: a checkpoint takes no [blocks].
rom = "../../examples/backgrounds/mode2/mode2.sfc"
frames = 260

[[checkpoint]]                 # the 192nd loop iteration, in Mode 2
at_symbol = "WaitForVBlank"
hit = 192
[checkpoint.values]
wave_phase = 384                  # +2 per loop iteration
"vram:3020" = { eq = 0x2044 }
"vram:3021" = { eq = 0x203B }
"vram:3022" = { eq = 0x2032 }
"vram:3023" = { eq = 0x2029 }
"vram:3024" = { eq = 0x2021 }
"vram:3025" = { eq = 0x201B }
"vram:3026" = { eq = 0x2015 }
"vram:3027" = { eq = 0x2012 }
"vram:3028" = { eq = 0x2010 }
"vram:3029" = { eq = 0x2010 }
"vram:302A" = { eq = 0x2012 }
"vram:302B" = { eq = 0x2015 }
"vram:302C" = { eq = 0x201B }
"vram:302D" = { eq = 0x2021 }
"vram:302E" = { eq = 0x2029 }
"vram:302F" = { eq = 0x2032 }
"vram:3030" = { eq = 0x203B }
"vram:3031" = { eq = 0x2044 }
"vram:3032" = { eq = 0x204D }
"vram:3033" = { eq = 0x2056 }
"vram:3034" = { eq = 0x205E }
"vram:3035" = { eq = 0x2064 }
"vram:3036" = { eq = 0x206A }
"vram:3037" = { eq = 0x206D }
"vram:3038" = { eq = 0x206F }
"vram:3039" = { eq = 0x206F }
"vram:303A" = { eq = 0x206D }
"vram:303B" = { eq = 0x206A }
"vram:303C" = { eq = 0x2064 }
"vram:303D" = { eq = 0x205E }
"vram:303E" = { eq = 0x2056 }
"vram:303F" = { eq = 0x204D }
"vram:3000" = { eq = 0x0000 }   # row 0: no H offsets
"vram:3001" = { eq = 0x0000 }   # row 0: no H offsets
"vram:3002" = { eq = 0x0000 }   # row 0: no H offsets
"vram:3003" = { eq = 0x0000 }   # row 0: no H offsets
"vram:3004" = { eq = 0x0000 }   # row 0: no H offsets
"vram:3005" = { eq = 0x0000 }   # row 0: no H offsets
"vram:3006" = { eq = 0x0000 }   # row 0: no H offsets
"vram:3007" = { eq = 0x0000 }   # row 0: no H offsets
[checkpoint.ppu]
bgmode = 2
"bgs.2.v_scroll" = 0              # row 0 = H offsets, row 1 = V offsets

[asserts.blocks]                  # the scene itself, unchanged for the run
bg1_tile3_solid    = { space = "vram", offset = "0060", hex = "ffffffffffffffffffffffffffffffff00000000000000000000000000000000" }
bg1_tile12_solid   = { space = "vram", offset = "0180", hex = "00000000000000000000000000000000ffffffffffffffffffffffffffffffff" }
bg1_map_row3       = { space = "vram", offset = "40C0", hex = "03000300030003000300030003000300" }
bg1_map_row12      = { space = "vram", offset = "4300", hex = "0c000c000c000c000c000c000c000c00" }

[asserts.dma]
unsafe_writes    = 0
max_vblank_bytes = 128
