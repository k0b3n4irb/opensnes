# demos/platform_objects: the first robot insect patrols its roof (world x
# 328-376, after the first vent) while Kit walks towards it and the camera
# follows.
#
# insectx is the insect's SCREEN x once its callback has run (world x minus
# map_cam_x). Measured on luna on 2026-10-19 with this script: frame 280,
# insectx 190 with the camera at 140 (world 330); frame 300, insectx 169
# with the camera at 164 (world 333): it has reached the left end of its
# range and turned back east (330 -> 333) while the camera follows Kit. An
# insect that did not move, or walked out of its range, changes both.
#
# 2026-11-01: insectx is not stable at a frame boundary. The callback sets it
# to the world x, then subtracts the camera before it draws, and the boundary
# falls inside the callback on some frames: the same ROM reads 333 (world) at
# frames 299 and 302 and 169 (screen) at 300, with the library before this
# date as well as after. A faster dynamic-sprite draw moved which frames those
# are, so frame 300 reads either form and the bound below holds for both
# (world 333 or screen 169; an insect that fell back west reads under 165).
rom = "../../examples/demos/platform_objects/platform_objects.sfc"
input = "60:0x0100,150:0x0180,152:0x0100"

[[checkpoint]]
at_frame = 280
[checkpoint.values]
insectx   = { eq = 190, width = 2 }
map_cam_x = { eq = 140, width = 2 }

[[checkpoint]]
at_frame = 300
[checkpoint.values]
insectx   = { ge = 165, width = 2 }
map_cam_x = { eq = 164, width = 2 }

[asserts.dma]
unsafe_writes = 0
