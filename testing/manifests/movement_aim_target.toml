# Migrated from probes/movement.py. The drone (target_x / target_y, its
# centre) moves one pixel a frame while a direction is held, and stays 16
# pixels from the edges (a 32x32 sprite drawn from its centre); the turret
# faces it, turret_heading = (atan2_8 + 8) >> 4, measured on luna v1.40.0:
# 14 at (200, 60) (angle 0xE7), 15 at (240, 60) (0xEE), 14 at (240, 16) (0xE3).
rom = "../../examples/basics/aim_target/aim_target.sfc"
frames = 180
[[checkpoint]]
at_frame = 60
[checkpoint.values]
"target_x.main" = { eq = 200, width = 2 }
"target_y.main" = { eq = 60, width = 2 }
turret_heading = { eq = 14, width = 1 }
[[checkpoint]]                 # RIGHT -> target_x up
at_frame = 120
input = "60:0x0100,119:0"
[checkpoint.delta]
"target_x.main" = "increased"
[checkpoint.values]
"target_x.main" = { eq = 240, width = 2 }
"target_y.main" = { eq = 60, width = 2 }
turret_heading = { eq = 15, width = 1 }
[[checkpoint]]                 # UP -> target_y down
at_frame = 180
input = "120:0x0800,179:0"
[checkpoint.delta]
"target_y.main" = "decreased"

# Every VRAM DMA of this input-driven run lands in blank or forced blank
# (added 2026-10-04: vram_dma_blank.py only sees the boot path; the gate for
# what a button press triggers is here, one manifest at a time).
[checkpoint.values]
"target_x.main" = { eq = 240, width = 2 }
"target_y.main" = { eq = 16, width = 2 }
turret_heading = { eq = 14, width = 1 }
[asserts.dma]
unsafe_writes = 0
# Measured values and the image after the whole script (testing audit T7/T10, 2026-10-05):
# the target moves one pixel per update while a direction is held, and an update that
# moves it redraws seven numbers: 59 frames of RIGHT are 30 updates since 2026-10-09
# (textPrint writes a run at once), 20 before; one update a frame since 2026-10-11
# (textPrintU16 no longer divides): x runs to its limit, 247, and y to 1 —
# 240 and 16 since 2026-10-22, when the X became a 32x32 drone kept on
# screen from its centre.
[asserts]
fbhash = "8614797929ef21a8"
