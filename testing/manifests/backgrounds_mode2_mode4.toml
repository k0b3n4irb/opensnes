# backgrounds/mode2, Mode 4 scene (B) — offset-per-tile with Mode 4's single row.
# (Written for backgrounds/mode4, which merged into mode2 on 2026-10-18.)
#
# Mode 4 reads ONE row of BG3 as the offset table (Mode 2 reads two): each
# word is either a vertical offset (bit 15 set) or a horizontal one (bit 15
# clear), bit 13 = apply to BG1, and the low 3 bits of a horizontal value are
# ignored (snesdev-wiki, Offset-per-tile). BG3's map is at word $7400, so the
# row is VRAM byte $E800.
#   * checkpoint 100: the words are vertical — high bytes $A0 (bit 15 + bit
#     13) — and BG3VOFS is 0, so the PPU reads that row (the y - 1 the lib
#     writes for a displayed layer would select row 31; see the mode2
#     manifest for the history);
#   * frame 130, after A at 110: the same wave as horizontal words — high
#     bytes $20, low 3 bits clear (0 to 24 pixels, whole tiles, since the
#     canal scene of 2026-10-23).
# Measured on luna v1.30.2 (`luna state --until-frame N --input … --dump-vram`).
rom = "../../examples/backgrounds/mode2/mode2.sfc"
# Clocked by the program since 2026-10-10 (luna v1.37.0): the checkpoints
# stop at the Nth arrival on WaitForVBlank, which the main loop calls once
# per iteration, and the press of A is indexed by the same arrivals. The
# wave words read at the end are then those of a known iteration, whatever
# the length of the boot (the frame-indexed version moved twice that day).
input_at = "WaitForVBlank"
frames = 200                           # the horizon: where the run gives up
input = "50:0x8000,52:0,105:0x0080,107:0"   # B at the 50th iteration: Mode 2 -> Mode 4; A at the 105th: vertical -> horizontal

[[checkpoint]]                 # the reference for the delta below: Mode 4 shown, not power-on RAM (2026-10-04)
at_symbol = "WaitForVBlank"
hit = 55
[checkpoint.values]
in_mode4 = { eq = 1, width = 1 }

[[checkpoint]]
at_symbol = "WaitForVBlank"
hit = 95
[checkpoint.values]
opt_vertical = { eq = 1, width = 1 }
[checkpoint.delta]
wave_phase = "increased"
[checkpoint.ppu]
bgmode = 4
"bgs.2.v_scroll" = 0

[[checkpoint]]                 # twenty iterations after the press: horizontal words, of a known iteration
at_symbol = "WaitForVBlank"
hit = 125
[checkpoint.values]
opt_vertical = { eq = 0, width = 1 }
# The offset row of iteration 125, as the loop just built it in RAM: with
# bit 13 set and bit 15 clear in every word, they are HORIZONTAL words.
# And the row the PPU has at that moment, which is the one of iteration
# 124, uploaded at the last VBlank: two words of VRAM read by their word
# address (`"vram:WORD"`, luna v1.38.0). The row lives at byte $E800 of
# VRAM, word $7400 (word $3000 until the canal scene, 2026-10-23). Until 2026-10-10 a block was read there at the last
# frame, whatever iteration that was.
"owords.main"   = { eq = 0x2008, width = 2 }
"owords.main+2" = { eq = 0x2008, width = 2 }
"owords.main+4" = { eq = 0x2010, width = 2 }
"owords.main+6" = { eq = 0x2010, width = 2 }
"vram:7400" = { eq = 0x2008 }
"vram:7401" = { eq = 0x2008 }

[asserts.values]
opt_vertical = { eq = 0, width = 1 }

[asserts.ppu]
bgmode = 4
"bgs.2.v_scroll" = 0

[asserts.dma]
unsafe_writes = 0
