# examples/audio/echo, wet again — START twice: the echo comes BACK.
#
# audioDisableEcho() mutes the echo volumes and stops the ring's writes.
# Until 2026-10-13 audioEnableEcho() after it set EON and nothing else: the
# backdrop went purple ("wet") over a dry sound, EVOL at 0 and FLG bit 5
# still set. The driver now starts the ring again as audioSetEcho() left it.
# The pair wet / dry says the echo can be turned off; this one that it can
# be turned on again.
rom = "../../examples/audio/echo/echo.sfc"
frames = 400
input = "220:0x1000,225:0,300:0x1000,305:0"

[asserts.dsp]
EON    = 0xFF        # routed again
EVOL_L = 0x28        # the volumes audioSetEcho() was given, back
EVOL_R = 0x28
FLG    = 0x00        # ECEN clear: the DSP writes the ring again
EDL    = 0x06
ESA    = 0xCF
EFB    = 0x5A
FIR0   = 0x7F
