# palette_cycle's whole thesis is that NOTHING on screen moves: the tiles,
# the tilemap and the scroll registers are frozen after init, and the
# animation is 32 bytes of CGRAM rewritten every fourth frame. Liveness
# cannot see that, and the fbhash baseline samples one frame of a rainbow
# that looks equally plausible at any rotation — a cycle that stopped, ran
# backwards, or skipped two slots per step would all hash to *a* valid
# picture.
#
# The exact-bytes assert is the point. At frame 360 the ROM has performed
# cycle_pos = 59 rotations, and CGRAM 0-31 is verified here to be the
# picture's palette with entries 8-15 of both BG palettes (the sign's
# letters, the coolant) rotated by exactly 59 mod 8 = 3 slots towards the
# higher index, and entries 0-7 of both (the wall, the frame, the pipe's
# metal) untouched. That single block ties the visible palette to the
# counter: rotate by two, rotate the wrong way, touch an entry that must
# stay, or lose the seam at entry 15 -> 8 and it fails. (Checked against
# res/sign.pal the day it was measured, luna v1.40.0, 2026-10-21.)
#
# The VRAM block is the negative. 32 bytes of tilemap row 0 at word $3C00
# (byte $7800) still read the wall's tiles after 59 rotations. If the
# "animation" ever became a tilemap rewrite this is what would catch it.
#
# START is the third claim: it freezes the cycle (cycle_pos unchanged over
# 60 whole frames, which is 15 rotations' worth) and a second press resumes
# it. Neither press is exercised by any other pillar.
rom = "../../examples/color/palette_cycle/palette_cycle.sfc"

[[checkpoint]]                 # cycling from boot, one rotation per 4 frames
at_frame = 120
[checkpoint.values]
cycling = { eq = 1, width = 1 }
cycle_pos = 29

[[checkpoint]]                 # free-running: +15 rotations in 60 frames
at_frame = 180
[checkpoint.values]
cycling = { eq = 1, width = 1 }
cycle_pos = 44
[checkpoint.delta]
cycle_pos = "increased"

[[checkpoint]]                 # START -> frozen; 60 frames pass, counter does not
at_frame = 240
input = "180:0x1000,185:0"
[checkpoint.values]
cycling = { eq = 0, width = 1 }
cycle_pos = 44
[checkpoint.delta]
cycle_pos = "unchanged"

[[checkpoint]]                 # still frozen 60 frames later
at_frame = 300
[checkpoint.values]
cycling = { eq = 0, width = 1 }
[checkpoint.delta]
cycle_pos = "unchanged"

[[checkpoint]]                 # START again -> resumes, exactly 15 more rotations
at_frame = 360
input = "300:0x1000,305:0"
[checkpoint.values]
cycling = { eq = 1, width = 1 }
cycle_pos = 59
[checkpoint.delta]
cycle_pos = "increased"

[asserts.blocks]
# both palettes, 8-15 of each rotated by 59 mod 8 = 3 slots
wheel = { space = "cgram", offset = "0000", hex = "00046214a31cc424651ca82c0c419055b430b4305c495f7b9f6a5c49b430b43000006214c4244835ed51d46ac5208318c63d89527073f67f70738952c63d442d" }
# tilemap row 0 at word $3C00: the wall, never rewritten
tilemap_row0 = { space = "vram", offset = "7800", hex = "0000010002000300020003000000010002000300020003000000010002000300" }
