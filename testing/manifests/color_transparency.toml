# transparency blends a 2bpp cloud layer (BG3, sub screen) additively over a
# 4bpp landscape (BG1, main screen) in Mode 1 with BG3 priority high, and
# scrolls the clouds one pixel per frame. There is no input and no game
# state, so the whole example is invisible to the liveness pillar, and the
# fbhash baseline samples a single frame — which cannot tell a scrolling
# sub screen from a frozen one, nor a blended frame from an opaque one.
#
# What this pins:
#   * the colour-math pair CGWSEL $02 (source = sub screen) + CGADSUB $21
#     (add, half off, BG1 $01 + backdrop $20). Drop the sub-screen bit and
#     the clouds become opaque rather than transparent.
#   * the scroll shadows: BG3's bg_scroll_x advances by exactly 60 over 60
#     frames (1 px/frame) across two legs, while BG1's stays 0 — the
#     landscape must not drift with the clouds. bg_scroll_x lives at
#     00:0063 as 4 u16 entries, so BG1 is 00:0063 and BG3 is 00:0067.
#   * the two palettes landed at DIFFERENT CGRAM offsets: clouds at entry 0
#     (2bpp) and the landscape at entry 16 (4bpp). An off-by-one in either
#     dmaCopyCGram destination would silently overwrite the other.
rom = "../../examples/color/transparency/transparency.sfc"
# Keys are `bg_scroll_x+N` (bytes, decimal; luna v1.28.0): they follow the array
# when RAM moves, which raw addresses did not (they broke on 2026-09-26).

[[checkpoint]]
at_frame = 60
[checkpoint.values]
colormath_cgwsel = { eq = 0x02, width = 1 }
colormath_cgadsub = { eq = 0x21, width = 1 }
"bg_scroll_x+4" = { eq = 58, width = 2 }        # BG3 h-scroll shadow, 1 px/frame
"bg_scroll_x" = { eq = 0, width = 2 }         # BG1 must not move

[[checkpoint]]
at_frame = 120
[checkpoint.values]
colormath_cgwsel = { eq = 0x02, width = 1 }
colormath_cgadsub = { eq = 0x21, width = 1 }
"bg_scroll_x+4" = { eq = 118, width = 2 }       # +60 in 60 frames
"bg_scroll_x" = { eq = 0, width = 2 }
[checkpoint.delta]
"bg_scroll_x" = "unchanged"

[asserts.blocks]
cloud_pal = { space = "cgram", offset = "0000", hex = "0000a438" }
# land_pal: the landscape's 16 colours as gfx4snes -a now lays them out. Until
# 2026-10-05 the tool reordered the .pal without rewriting the tiles, and this
# line pinned that wrong order (0000 347f 957f ... 0002 ...): the picture was
# brown and mauve. The colour 0x08c9 is back; 0x0002 was a casualty of the bug.
land_pal  = { space = "cgram", offset = "0020", hex = "0000183f5322ad2d492dc524c9084e19d329783e1d53dd7ff87f957f347f2003" }
