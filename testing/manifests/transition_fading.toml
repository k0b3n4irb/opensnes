# fading cycles six brightness ramps at three speeds: fadeOut/fadeIn(1),
# then (3), then (6) — one VBlank wait per step, three, then six — and then
# the mosaic out and back in (the mosaic example's legs, merged here on
# 2026-10-18 with the example itself). Every
# transition is gated on a button press, so the ROM sits on a full-bright
# static picture forever if nobody presses anything: liveness sees a healthy
# NMI and the fbhash baseline captures frame-N of that same idle picture.
# Not one of the six ramps is exercised by either pillar today.
#
# The `speed` parameter is the subject, and the assert that proves it is the
# reading taken exactly 10 frames after each press:
#
#     fadeOut(1) @60  -> brightness 6 at frame 70   (~1 step/frame)
#     fadeOut(3) @140 -> brightness 12 at frame 150 (~1 step/3 frames)
#     fadeOut(6) @300 -> brightness 14 at frame 310 (~1 step/6 frames)
#
# Same starting brightness, same elapsed frames, three different answers.
# A fadeOut() that ignored `speed` (or a WaitForVBlank() that stopped
# blocking) would collapse all three onto the same number; a fade that ran
# off the end of the ramp would overshoot past 0 or 15. Both ends are
# pinned too: the ramps land exactly on 0 and exactly on 15 and stop there.
#
# console_force_blanked is the negative. setBrightness(0) is NOT forced blank
# (console.h carries that warning), so a fade to black must leave the
# force-blank shadow at 0 — a fadeOut that blanked the screen instead of
# dimming it would make VRAM writable mid-fade and look identical.
#
# The two 6-frame fades are the non-blocking ones (fadeStart / fadeStep): they
# keep the same brightness at the same frames as the blocking fades above,
# which is the proof that they last as long, and `fade_ticks`, which the main
# loop advances once a frame during them, reads 96 after the first (16 x 6).
# The blocking fadeOut()/fadeIn() could not have counted a frame.
#
# The mosaic legs: mosaic_size / mosaic_bg_mask are the lib's shadow of
# $2106 (the register is write-only; checked against the PPU on the day it
# was written, the shadow pair 15/1 matched ppu.mosaic = $F1). The ramp is
# pinned mid-flight: 15 frames into mosaicFadeOut(3) the size is 5, at 30
# it is 10, at 50 it has reached MOSAIC_MAX = 15 and STOPPED there (a size
# that wrapped to 0 would pixelate forever); coming back it is 10, then 5,
# and mosaicDisable() leaves the pair at 0/0. The two negatives are what
# sharing one screen costs: mosaic_size stays 0 through every brightness
# fade (fadeOut must not reach $2106) and console_brightness stays 15
# through both mosaic ramps (mosaicFade* must not reach $2100).
rom = "../../examples/transitions/fading/fading.sfc"

[[checkpoint]]                 # idle at full brightness, waiting for the first press
at_frame = 60
[checkpoint.values]
console_brightness = { eq = 15, width = 1 }
console_force_blanked = { eq = 0, width = 1 }

[[checkpoint]]                 # fadeOut(1), 10 frames in: fast
at_frame = 70
input = "60:0x0080,64:0"
[checkpoint.values]
console_brightness = { eq = 6, width = 1 }
mosaic_size = { eq = 0, width = 1 }        # the fade must not touch $2106

[[checkpoint]]                 # fadeOut(1) complete: exactly 0, and NOT force blank
at_frame = 80
[checkpoint.values]
console_brightness = { eq = 0, width = 1 }
console_force_blanked = { eq = 0, width = 1 }

[[checkpoint]]                 # fadeIn(1), 10 frames in
at_frame = 110
input = "100:0x0080,104:0"
[checkpoint.values]
console_brightness = { eq = 9, width = 1 }

[[checkpoint]]                 # fadeIn(1) complete: exactly 15, no overshoot
at_frame = 120
[checkpoint.values]
console_brightness = { eq = 15, width = 1 }

[[checkpoint]]                 # fadeOut(3), 10 frames in: three times slower
at_frame = 150
input = "140:0x0080,144:0"
[checkpoint.values]
console_brightness = { eq = 12, width = 1 }

[[checkpoint]]                 # fadeOut(3) complete at ~48 frames
at_frame = 190
[checkpoint.values]
console_brightness = { eq = 0, width = 1 }
console_force_blanked = { eq = 0, width = 1 }

[[checkpoint]]                 # fadeIn(3), 10 frames in
at_frame = 230
input = "220:0x0080,224:0"
[checkpoint.values]
console_brightness = { eq = 3, width = 1 }

[[checkpoint]]                 # fadeIn(3) complete
at_frame = 270
[checkpoint.values]
console_brightness = { eq = 15, width = 1 }

[[checkpoint]]                 # fadeOut(6), 10 frames in: barely moved
at_frame = 310
input = "300:0x0080,304:0"
[checkpoint.values]
console_brightness = { eq = 14, width = 1 }

[[checkpoint]]                 # still descending 30 frames later
at_frame = 340
[checkpoint.values]
console_brightness = { eq = 9, width = 1 }
[checkpoint.delta]
console_brightness = "decreased"

[[checkpoint]]                 # fadeOut(6) complete at ~96 frames
at_frame = 400
[checkpoint.values]
console_brightness = { eq = 0, width = 1 }
console_force_blanked = { eq = 0, width = 1 }
fade_ticks = { eq = 96, width = 2 }        # the loop ran every frame of this non-blocking fade: 16 levels x 6

[[checkpoint]]                 # fadeIn(6) complete: full brightness, mosaic still off
at_frame = 520
input = "420:0x0080,424:0"
[checkpoint.values]
console_brightness = { eq = 15, width = 1 }
mosaic_size = { eq = 0, width = 1 }
mosaic_bg_mask = { eq = 0, width = 1 }

[[checkpoint]]                 # mosaicSetLayers(BG1) + mosaicFadeOut(3), 15 frames in
at_frame = 555
input = "540:0x0080,544:0"
[checkpoint.values]
mosaic_bg_mask = { eq = 1, width = 1 }     # LAYER_BG1
mosaic_size = { eq = 5, width = 1 }
console_brightness = { eq = 15, width = 1 }   # the mosaic must not touch $2100

[[checkpoint]]                 # 30 frames in: 10 blocks, linear in speed
at_frame = 570
[checkpoint.values]
mosaic_size = { eq = 10, width = 1 }
[checkpoint.delta]
mosaic_size = "increased"

[[checkpoint]]                 # at MOSAIC_MAX and clamped there
at_frame = 590
[checkpoint.values]
mosaic_size = { eq = 15, width = 1 }
mosaic_bg_mask = { eq = 1, width = 1 }
console_brightness = { eq = 15, width = 1 }

[[checkpoint]]                 # mosaicFadeIn(3) unwinding
at_frame = 625
input = "610:0x0080,614:0"
[checkpoint.values]
mosaic_size = { eq = 10, width = 1 }
[checkpoint.delta]
mosaic_size = "decreased"

[[checkpoint]]
at_frame = 640
[checkpoint.values]
mosaic_size = { eq = 5, width = 1 }
[checkpoint.delta]
mosaic_size = "decreased"

[[checkpoint]]                 # mosaicDisable(): size AND the BG bit cleared
at_frame = 665
[checkpoint.values]
mosaic_size = { eq = 0, width = 1 }
mosaic_bg_mask = { eq = 0, width = 1 }
console_brightness = { eq = 15, width = 1 }
