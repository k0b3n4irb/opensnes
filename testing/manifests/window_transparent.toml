# transparent_window — the two WH0/WH1 HDMA tables the example BUILDS at
# runtime, byte for byte, plus both channels armed.
#
# What this proves that the other pillars cannot:
#   * The tables are computed in main() from RECT_X/RECT_Y/RECT_WIDTH/
#     RECT_HEIGHT, not loaded from ROM. This is the only place the corpus
#     reads that computation back, and it pins the geometry as numbers:
#     $60 = 96 lines skipped (RECT_Y), $70 = 112 lines (RECT_HEIGHT),
#     $28 = 40 (RECT_X) on WH0, $D8 = 216 (RECT_X + RECT_WIDTH) on WH1.
#   * The encoding is the point of the example: a constant edge is one entry
#     (a line count without the repeat flag, one byte held for that many
#     lines), not one byte per line. The same rectangle can be encoded either
#     way and a framebuffer hash cannot tell them apart; here the encoding
#     itself is the assert. Until 2026-10-15 the example used repeat mode and
#     taught that WH0/WH1 must be refreshed on every line, which they need
#     not be ("write once, then wait", snesdev wiki).
#   * The asymmetry is deliberate and pinned: the WH0 table ends with a
#     1-line [$01][$FF] disable entry before its terminator, the WH1 table
#     terminates straight after its entry (WH0 = 255 disables the window
#     below the rectangle). Anyone "fixing" that asymmetry has to update
#     this file on purpose.
#   * W12SEL, WOBJSEL, CGWSEL, CGADSUB and COLDATA have no WRAM shadow, so
#     they cannot be asserted here. `luna state --out -` reports them at
#     frame 60 as w12sel $20, wobjsel $20, cgwsel $10, cgadsub $82, coldata
#     (12,12,12), ppu.windows = [255, 216, 0, 0] — the colour-math half of
#     the effect stays the fbhash baseline's job.
#
# Measured: `luna state --until-frame 60 --peek hdma_left:8 --peek
# hdma_right:8 --peek hdma_enabled_state:1`; dma.hdmaen = 48 confirmed the
# shadow.
rom = "../../examples/windows/transparent_window/transparent_window.sfc"
frames = 60

[asserts.values]
hdma_enabled_state = { eq = 0x30, width = 1 }   # channels 4 (WH0) + 5 (WH1)

[asserts.blocks]
hdma_left  = { space = "wram", offset = "hdma_left",  hex = "60FF702801FF0000" }
hdma_right = { space = "wram", offset = "hdma_right", hex = "600070D800000000" }
