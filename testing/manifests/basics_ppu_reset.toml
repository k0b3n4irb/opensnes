"bg_scroll_x+0" = { eq = 0, width = 2 }
"bg_scroll_x+2" = { eq = 0, width = 2 }
"bg_scroll_x+4" = { eq = 0, width = 2 }
"bg_scroll_x+6" = { eq = 0, width = 2 }
"bg_scroll_y+0" = { eq = 0, width = 2 }
"bg_scroll_y+2" = { eq = 0, width = 2 }
"bg_scroll_y+4" = { eq = 0, width = 2 }
"bg_scroll_y+6" = { eq = 0, width = 2 }
bg_scroll_dirty = { eq = 0, width = 1 }
