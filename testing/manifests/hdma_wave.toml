# hdma_wave — the hand-built table's krom cadence, then the hdma module's
# wave and the switch between the two (merged with hdma_wave_table on
# 2026-09-26).
#
# What this proves that the other pillars cannot:
#   * The hand-built table is never written; the only thing that moves is
#     the HDMA start pointer, one 3-byte entry per VBlank. The fbhash
#     baseline samples early frames — it cannot tell one entry per frame
#     from two, and it samples nowhere near the wrap. WAVE_WRAP (672) is
#     the correctness-critical constant of the krom port (a non-integer
#     quasi-period): the f672 -> f700 pair is the only place in the corpus
#     where the wrap runs, 668 -> 24 = 696 mod 672.
#   * Every control is dead code without input: A hands the ripple to the
#     hdma module (channel 0 off, channel 6 on — hdma_enabled_state is the
#     lib's shadow of $420C), LEFT/RIGHT move the module's amplitude, which
#     must clamp at 24 and at 2 (asserted past both ends), and A again
#     must re-arm the hand-built table from the phase it left, not from 0.
#   * hdma_wave_amplitude is the module's own copy: the example's `amp`
#     reaching it proves hdmaWaveH() took the new value.
rom = "../../examples/hdma/hdma_wave/hdma_wave.sfc"

[[checkpoint]]                 # armed at boot, the hand-built table on ch0
at_frame = 60
[checkpoint.values]
wave_phase = 56
use_lib = { eq = 0, width = 1 }
hdma_enabled_state = { eq = 0x01, width = 1 }

[[checkpoint]]                 # exactly +1 entry per frame over 60 frames
at_frame = 120
[checkpoint.values]
wave_phase = 116
[checkpoint.delta]
wave_phase = "increased"

[[checkpoint]]                 # just short of WAVE_WRAP (672)
at_frame = 672
[checkpoint.values]
wave_phase = 668

[[checkpoint]]                 # wrapped: 696 mod 672 — the seam krom needs
at_frame = 700
[checkpoint.values]
wave_phase = 24
hdma_enabled_state = { eq = 0x01, width = 1 }   # the wrap must not disarm it
[checkpoint.delta]
wave_phase = "decreased"

[[checkpoint]]                 # and the cadence is unchanged after the seam
at_frame = 740
[checkpoint.values]
wave_phase = 64

[[checkpoint]]                 # A: the hdma module takes over on ch6
at_frame = 800
input = "760:0x0080,764:0"
[checkpoint.values]
use_lib = { eq = 1, width = 1 }
hdma_enabled_state = { eq = 0x40, width = 1 }   # ch0 off, ch6 on
amp = { eq = 10, width = 1 }
hdma_wave_amplitude = { eq = 10, width = 1 }
wave_phase = 84                                 # frozen where A found it

[[checkpoint]]                 # 8 x RIGHT from 10: clamps at 24, not 26
at_frame = 900
input = "800:0x0100,804:0,810:0x0100,814:0,820:0x0100,824:0,830:0x0100,834:0,840:0x0100,844:0,850:0x0100,854:0,860:0x0100,864:0,870:0x0100,874:0"
[checkpoint.values]
amp = { eq = 24, width = 1 }
hdma_wave_amplitude = { eq = 24, width = 1 }
wave_phase = 84                                 # still frozen

[[checkpoint]]                 # 12 x LEFT from 24: clamps at 2, not 0
at_frame = 1040
input = "900:0x0200,904:0,910:0x0200,914:0,920:0x0200,924:0,930:0x0200,934:0,940:0x0200,944:0,950:0x0200,954:0,960:0x0200,964:0,970:0x0200,974:0,980:0x0200,984:0,990:0x0200,994:0,1000:0x0200,1004:0,1010:0x0200,1014:0"
[checkpoint.values]
amp = { eq = 2, width = 1 }
hdma_wave_amplitude = { eq = 2, width = 1 }
use_lib = { eq = 1, width = 1 }

[[checkpoint]]                 # A again: back on ch0, from the frozen phase
at_frame = 1100
input = "1040:0x0080,1044:0"
[checkpoint.values]
use_lib = { eq = 0, width = 1 }
hdma_enabled_state = { eq = 0x01, width = 1 }
amp = { eq = 2, width = 1 }                     # the amplitude survives
[checkpoint.delta]
wave_phase = "increased"
