# The map+object engine drives Kit through objCollidMapWithSlopes /
# objUpdateXY (the level is the rooftops with ramps since 2026-10-19; spawn
# (32, 160), the walk stays on the flat before the first vent at x 144);
# kit.c mirrors the workspace position back into kitx/kity every
# frame, and the lib's camera is map_cam_x/map_cam_y.
#
# Leg 2 is the idle negative: 60 more frames with the pad released must
# leave kitx, kity AND the camera exactly where they were — gravity
# has already settled him on the ground, so any drift is a bug.
#
# Legs 3 and 4 walk right then left. kity = 160 at every checkpoint is
# the second negative: he walks along the floor, he never falls through
# it. kitflp is the facing flag the animation code sets, so it proves
# the direction reached the object callback, not just the position.
rom = "../../examples/demos/mapandobjects/mapandobjects.sfc"

[[checkpoint]]                 # spawn, standing on the ground
at_frame = 60
[checkpoint.values]
kitx = 32
kity = 160
map_cam_x = 0                                # camera has not scrolled
kitflp = { eq = 0, width = 1 }         # facing right

[[checkpoint]]                 # no input -> nothing moves
at_frame = 120
[checkpoint.delta]
kitx = "unchanged"
kity = "unchanged"
map_cam_x = "unchanged"

[[checkpoint]]                 # RIGHT for 59 frames: accelerates east
at_frame = 180
input = "120:0x0100,179:0"
[checkpoint.values]
kitx = 99
kity = 160                              # still on the floor
kitflp = { eq = 0, width = 1 }

[[checkpoint]]                 # LEFT for 30 frames: back west, sprite flips
at_frame = 240
input = "180:0x0200,210:0"
[checkpoint.values]
kitx = 63
kity = 160
kitflp = { eq = 1, width = 1 }         # facing left

# Every VRAM DMA of this input-driven run lands in blank or forced blank
# (added 2026-10-04: vram_dma_blank.py only sees the boot path; the gate for
# what a button press triggers is here, one manifest at a time).
[asserts.dma]
unsafe_writes = 0
