# games/likemario, the whole game: START at 100, RIGHT held from 110, and A
# pressed ten times. Kit crosses every gap, gets past the four robot insects
# and the two drones (two of them stomped), takes 22 of the 29 shards and
# reaches the beacon at x = GOAL_X = 2256 on the last roof (surface row 15:
# y = 120 - 16 = 104) at frame 1905, with his three lives. Score, in tens:
# 22 shards (22) + 2 stomps (20) + the bonus of three lives left (150) = 192.
#
# What this proves that the other manifests cannot: the level is beatable
# without losing a life, with the normal jump and the machines where the
# level puts them. A level edit that puts a roof out of reach, a machine
# whose patrol cannot be passed, a stomp that stopped counting, or a change
# to the jump physics fails here instead of in a player's hands.
#
# The ten presses were found on luna on 2026-10-20 by a greedy search, press
# after press: from the last press, the earliest frame after which Kit still
# has three lives and is furthest right 70 frames later.
rom = "../../examples/games/likemario/likemario.sfc"

[[checkpoint]]
at_frame = 1960
input = "100:0x1000,102:0,110:0x0100,302:0x0180,304:0x0100,416:0x0180,418:0x0100,492:0x0180,494:0x0100,640:0x0180,642:0x0100,882:0x0180,884:0x0100,1198:0x0180,1200:0x0100,1320:0x0180,1322:0x0100,1678:0x0180,1680:0x0100,1760:0x0180,1762:0x0100,1836:0x0180,1838:0x0100"
[checkpoint.values]
game_state = { eq = 4, width = 1 }       # GS_CLEAR
"kit_x.main" = { eq = 2256, width = 2 }
"kit_y.main" = { eq = 104, width = 2 }
lives = { eq = 3, width = 1 }
shards_got = { eq = 22, width = 1 }
score = 192

[asserts.dma]
unsafe_writes = 0
