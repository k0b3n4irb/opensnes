# SA-1 power cycle, second half: load the battery file d_ wrote. The
# fixture reads BW-RAM before writing anything, so r_boot is what survived
# the power cycle: the pattern the previous run saved.
rom = "../../devtools/libtests_sa1_sram/libtest_sa1_sram.sfc"
steps = 1500000
srm_in = "sa1_bwram.srm"
[asserts.values]
r_done = 0xBEEF
[asserts.blocks]
r_boot = "C1D2E3F4"
