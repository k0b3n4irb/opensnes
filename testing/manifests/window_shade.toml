# The window's second use: the region of colour math rather than a mask.
# Y switches the torch beam of windows/window from clipping to lighting — the
# lesson of PVSnesLib's TransparentWindow, which was its own example until
# 2026-10-18 (windows/transparent_window, a rectangle) and is now this mode;
# it subtracted to darken, the beam adds to light (2026-10-21).
#
# The registers are the subject: no layer clipped (W12SEL $00, TMW $00), the
# colour window on (WOBJSEL $20, window 1 not inverted), colour math "inside
# the colour window" from a fixed colour (CGWSEL $10), adding on BG1 and
# BG2 (CGADSUB $03: bit 7 clear is addition), the warm 6/5/2 in COLDATA. The
# middle leg is the negative: A goes back to masking, and the masking mode
# must switch colour math off (CGADSUB $00: no layer takes part). The hash is
# the lit picture.
#
# Measured on luna v1.40.0: `luna state --until-frame N --input … --peek
# hdma_enabled_state:1 --out -` (ppu.*).
rom = "../../examples/windows/window/window.sfc"

[[checkpoint]]                 # Y: the beam lights both BGs
at_frame = 100
input = "60:0x4000,64:0"
[checkpoint.values]
hdma_enabled_state = { eq = 0x30, width = 1 }   # channels 4 (WH0) + 5 (WH1)
[checkpoint.ppu]
w12sel = 0x00
wobjsel = 0x20
tmw = 0x00
cgwsel = 0x10
cgadsub = 0x03
coldata_r = 6
coldata_g = 5
coldata_b = 2

[[checkpoint]]                 # A: back to masking BG1 — colour math off
at_frame = 150
input = "110:0x0080,114:0"
[checkpoint.ppu]
w12sel = 0x03
tmw = 0x01
cgadsub = 0x00

[[checkpoint]]                 # Y again: lit, held for the hash
at_frame = 220
input = "160:0x4000,164:0"
[checkpoint.ppu]
wobjsel = 0x20
cgadsub = 0x03

[asserts]
fbhash = "26c57d985995ac94"
