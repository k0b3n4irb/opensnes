# animated_sprite — the D-pad walk: movement, the three walk clips, the
# left-facing mirror and the top clamp, none of which runs without input.
#
# What this proves that the other pillars cannot:
#   * Liveness and the fbhash baseline see Kit standing at
#     (100, 100) on tile 0: padHeld() is never non-zero, so movement, clip
#     selection, animTick() and the H-flip are dead code to them.
#   * One pixel per frame held: RIGHT from frame 60 to 119 moves x from 100
#     to 160 (60 frames).
#   * The top clamp is `if (y >= SCREEN_TOP) y--` with SCREEN_TOP = -16, so
#     140 frames of UP stop at y = -17, one past the constant (117 steps
#     from 100). An edge worth pinning: a `>` would stop at -16, a missing
#     clamp would wrap y. UP must not move x.
#   * The clips advance every ANIM_DELAY = 6 ticks and only while a
#     direction is held: after 140 UP ticks walk_up (68, 72, 76, 128, 132)
#     is on frame floor(139 / 6) mod 5 = 3 -> tile 128; LEFT then restarts
#     walk_side (136, 140, 192, 196, 200) and 30 ticks later it is on frame
#     floor(29 / 6) mod 5 = 4 -> tile 200. Releasing the pad (frame 290)
#     freezes everything.
#   * LEFT reuses the right-facing tiles with flipx = 1, which reaches OAM
#     as the H-flip bit of entry 0 (OAM y is y = -17 -> $EF).
#
# Measured: `luna state --until-frame N --input "60:0x0100,120:0x0800,
# 260:0x0200,290:0" --peek kit:8 --out -` at 120/260/290/320 ->
# x,y,gfx_frame,state,flipx = 160,100,200,2,0 / 160,-17,128,1,0 /
# 130,-17,200,2,1 / 130,-17,200,2,1 (struct Walker: s16 x, s16 y,
# u16 gfx_frame, u8 state, u8 flipx; `kit` read at width 2 is x). Kit
# became the sprite on 2026-10-19: 32x32 blocks, five frames per clip.
rom = "../../examples/sprites/animated_sprite/animated_sprite.sfc"

[[checkpoint]]                 # RIGHT held 60..119: x 100 -> 160
at_frame = 120
input = "60:0x0100"
[checkpoint.values]
kit = { eq = 160, width = 2 }

[[checkpoint]]                 # UP held 120..259: y clamps at -17, x untouched
at_frame = 260
input = "120:0x0800"
[checkpoint.values]
kit = { eq = 160, width = 2 }
[checkpoint.delta]
kit = { dir = "unchanged", width = 2 }

[[checkpoint]]                 # LEFT held 260..289: x 160 -> 130
at_frame = 290
input = "260:0x0200,290:0"
[checkpoint.values]
kit = { eq = 130, width = 2 }
[checkpoint.delta]
kit = { dir = "decreased", width = 2 }

[[checkpoint]]                 # released: nothing moves, the frame stays
at_frame = 320
[checkpoint.delta]
kit = { dir = "unchanged", width = 2 }

[asserts.blocks]               # the whole struct at the end: x 130, y -17,
kit = "8200efffc8000201"   # tile 200 (the fifth side frame), state 2 (side), flipx 1

[asserts.oam.sprites.0]        # what the PPU gets: tile 200 mirrored
x = 130
tile = 200
hflip = true
