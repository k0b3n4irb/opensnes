# world_sprites — oamPlaceWorld() on two batches (17 data shards of 16x16,
# six residents of 32x32 sorted by depth through `order`) against a camera
# the D-pad moves, over a square of the Rue basse (BG1, 64x64). The visual
# baseline runs with no input, so the camera never leaves the centre there
# and the clamp at the world's edge is never reached.
#
# Measured on luna (`luna state --until-frame N --input … --peek …`):
#   * frame 50, no input: cam (128, 112), 2 shards in view (world_visible,
#     the sum of visible[] the call filled; the shards drift one step per
#     main-loop turn, so the count is the frame's — it was 5 until the
#     compiler's stage 2 of 2026-10-12 made the boot one lag frame shorter
#     (12 for 13), which put the shards one step ahead: the fall from 5 to 2
#     moved from frame 51 to 50; 120 and 200 did not move), resident 0
#     in the front slot (world_front = res_order[0]: the resident lowest on
#     the screen);
#   * frame 120, RIGHT held from 60: cam_x 248 (2 px a frame), 2 shards,
#     resident 1 in front — the residents pace up and down, so the sort
#     changes the front slot over time. It was 4 until 2026-10-22: the
#     square's assets replaced twenty one-tile uploads at boot, the main
#     loop starts on frame 5 instead of 15, the shards are ten steps ahead;
#   * frame 200: the camera stopped at the world's edge (512 - 256 = 256)
#     on frame 124; 6 shards in view; resident 0 in front again.
# A regression in the call's culling or in visible[] moves world_visible;
# one in the sort or in `order` moves world_front; one in the clamp or the
# pad moves cam_x.
rom = "../../examples/sprites/world_sprites/world_sprites.sfc"
input = "60:0x0100,180:0"

[[checkpoint]]                 # before any input: the centre of the world
at_frame = 50
[checkpoint.values]
cam_x = { eq = 128, width = 2 }
cam_y = { eq = 112, width = 2 }
world_visible = { eq = 2, width = 2 }
world_front = { eq = 0, width = 2 }

[[checkpoint]]                 # RIGHT held: the camera on its way, another resident in front
at_frame = 120
[checkpoint.values]
cam_x = { eq = 248, width = 2 }
world_visible = { eq = 2, width = 2 }
world_front = { eq = 1, width = 2 }

[[checkpoint]]                 # the camera reached the edge and stays
at_frame = 200
[checkpoint.values]
cam_x = { eq = 256, width = 2 }
cam_y = { eq = 112, width = 2 }
world_visible = { eq = 6, width = 2 }
world_front = { eq = 0, width = 2 }

[asserts.dma]
unsafe_writes = 0
