# games/mapandobjects — the first Goomba patrols its stretch of the slope
# level (world x 352-432, between the pipe and the first slope). Mario
# crosses the two pipes on the way (a jump, then a high jump with UP+A) so
# the camera reaches it.
#
# goombax is the Goomba's SCREEN x once its callback has run (world x minus
# map_cam_x). Measured with this script: frame 330, goombax 150 with the
# camera at 220 (world 370); frame 340, goombax 135 with the camera at 232
# (world 367): it walks left, inside its range, while the camera follows
# Mario. A Goomba that did not move, or ran off its range, changes both.
rom = "../../examples/games/mapandobjects/mapandobjects.sfc"
#        RIGHT      A over pipe 1          UP+A over pipe 2
input = "60:0x0100,195:0x0180,215:0x0100,225:0x0980,250:0x0100"

[[checkpoint]]
at_frame = 330
[checkpoint.values]
goombax   = { eq = 150, width = 2 }
map_cam_x = { eq = 220, width = 2 }

[[checkpoint]]
at_frame = 340
[checkpoint.values]
goombax   = { eq = 135, width = 2 }
map_cam_x = { eq = 232, width = 2 }

[asserts.dma]
unsafe_writes = 0
