# window (the HDMA torch beam) — the A/X/B layer-reselect path: it must re-arm
# HDMA every time, and it must actually change what is masked.
#
# What this proves that the other pillars cannot:
#   * Liveness and the fbhash baseline run with NO input, so setup_window()
#     is only ever executed once, at boot, with both BGs selected. The three
#     documented buttons — A = the beam on the alley (BG1) only, X = on the
#     rain (BG2) only, B = both — are untested by the corpus otherwise.
#   * setup_window() disables channels 4+5, reprograms the windows through
#     the window module and the two HDMA tables, then re-enables. Drop the
#     re-enable and the beam disappears forever after the first button
#     press; hdma_enabled_state (the lib's shadow of $420C) must read back
#     0x30 after every leg.
#   * `[checkpoint.ppu]` reads the hardware, so each leg pins the registers
#     themselves, and they spell the button semantics out:
#         boot / B  both BGs   w12sel 0x33  wobjsel 0x00  tmw 0x03
#         X         BG2 only   w12sel 0x30  wobjsel 0x00  tmw 0x02
#         A         BG1 only   w12sel 0x03  wobjsel 0x00  tmw 0x01
#     (w12sel's low nibble is BG1's enable+invert pair, the high nibble
#     BG2's; tmw's bits 0/1 are BG1/BG2 masked.) WOBJSEL and TMW's OBJ bit
#     stay 0: the window is not enabled on sprites, so Kit stays visible in
#     the dark. WH0 reads 152 at the end of the frame: the beam's edge on the
#     last line, 44 + 3 x (223 - 187) — the HDMA table, not a write of ours,
#     drives it.
#   * The two beam tables are computed at boot by buildBeam(); the blocks
#     below pin them: 117 lines without a window (WH0 255 > WH1 0), then
#     0xEB = repeat | 107, the cone's left edge 254 -> 44 -> 152 (three
#     pixels a line), the right edge 255 on every line, and the end.
#   * The render hash is the end-to-end check that the beam reaches the
#     screen, at frame 240 with A held. Regenerate with `luna test --update`
#     after an intended render change.
#
# Measured on luna v1.40.0: `luna state --until-frame N --input … --peek
# hdma_enabled_state:1 --peek tablelefttriangle:#111 --peek
# tablerighttriangle:#111 --out -`.
rom = "../../examples/windows/window/window.sfc"

[[checkpoint]]                 # boot: both BGs clipped, channels 4+5 armed
at_frame = 60
[checkpoint.values]
hdma_enabled_state = { eq = 0x30, width = 1 }
[checkpoint.ppu]
w12sel = 0x33                    # both BGs clipped
wobjsel = 0x00                   # not the sprites: Kit stays visible
tmw = 0x03
"windows.0" = 152                # WH0: the beam's edge on the last line, from the HDMA table

[[checkpoint]]                 # X: BG2 only — reconfigure keeps HDMA armed
at_frame = 120
input = "60:0x0040,119:0"
[checkpoint.values]
hdma_enabled_state = { eq = 0x30, width = 1 }
[checkpoint.ppu]
w12sel = 0x30                    # BG2 only
wobjsel = 0x00
tmw = 0x02
"windows.0" = 152

[[checkpoint]]                 # B: back to both BGs
at_frame = 180
input = "130:0x8000,179:0"
[checkpoint.values]
hdma_enabled_state = { eq = 0x30, width = 1 }
[checkpoint.ppu]
w12sel = 0x33                    # both again
wobjsel = 0x00
tmw = 0x03
"windows.0" = 152

[[checkpoint]]                 # A: BG1 only, held through the capture
at_frame = 240
input = "190:0x0080"
[checkpoint.values]
hdma_enabled_state = { eq = 0x30, width = 1 }
[checkpoint.ppu]
w12sel = 0x03                    # BG1 only
wobjsel = 0x00
tmw = 0x01
"windows.0" = 152

[asserts]
fbhash = "79e227b74d08cc64"

[asserts.blocks]
tablelefttriangle  = { space = "wram", offset = "tablelefttriangle",  hex = "75FFEBFEFBF8F5F2EFECE9E6E3E0DDDAD7D4D1CECBC8C5C2BFBCB9B6B3B0ADAAA7A4A19E9B9895928F8C898683807D7A7774716E6B6865625F5C595653504D4A4744413E3B3835322F2C2F3235383B3E4144474A4D505356595C5F6265686B6E7174777A7D808386898C8F92959800" }
tablerighttriangle = { space = "wram", offset = "tablerighttriangle", hex = "7500EBFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF00" }
