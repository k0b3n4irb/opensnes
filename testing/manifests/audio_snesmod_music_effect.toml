# An effect over the music: Y at frame 80 plays the selected effect (hall
# strings, normal pitch) while pollen8 goes on. The snesmod_sfx example
# proved snesmodPlayEffect alone (audio_snesmod_sfx_play.toml); since the
# two examples merged on 2026-10-18 the effect has to share the SPC700 with
# a module, which is the case a game is in.
#
# Measured on luna at frame 88: the effect is on voice 7 (ENVX 2032) and the
# music still sounds on voice 1 (ENVX 1840). Without the press, voice 7 is
# silent at the same frame (ENVX 0): the assert sees the effect, not the song.
# The loop starts at frame 49 (the four effects are uploaded before
# snesmodPlay), so a press before it is not seen.
rom = "../../examples/audio/snesmod_music/music.sfc"
frames = 88
input = "80:0x4000,84:0"
[asserts]
audio_rms_min = 50.0
[asserts.dsp]
V7_ENVX = { ge = 1 }
V1_ENVX = { ge = 1 }
