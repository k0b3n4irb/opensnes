# Migrated from probes/hw_math.py (the ppumul half) to a native `luna test`
# manifest — luna#181. PPU Mode 7 signed multiply ($211B M7A × $211C M7B ->
# signed 24-bit at $2134/$2135/$2136). Values verified bit-exact vs Mesen2 +
# fullsnes during the stress campaign. res[] block (linker-placed), 3 raw product
# bytes per case (low u16 + high u8).
rom = "ppumul.sfc"
# Keys are `res+N` (bytes, decimal; luna v1.28.0): they follow the array
# when RAM moves, which raw addresses did not (they broke on 2026-09-26).
steps = 500000

[asserts]
wdm_empty = true               # no SNES_ASSERT fired

[asserts.values]               # low u16 (+ high u8 where the sign matters)
"res" = 0x1388               # 1000 * 5      = +5000        (0x001388)
"res+3" = 0xEC78               # -1000 * 5     = -5000        (low 16 of 0xFFEC78)
"res+5" = 0xFF                 #   ...high byte $FF -> negative
"res+12" = 0x7F81               # 32767 * 127   = +4161409     (low 16 of 0x3F7F81)
"res+14" = 0x3F                 #   ...high byte $3F
"res+17" = 0x40                 # -32768 * -128 = +4194304     (0x400000) high byte
"res+24" = 0xC0DE               # done marker
