# testing/manifest.toml — per-example overrides of the corpus runner.
#
# The runner auto-discovers every example via its git-tracked main.c and
# applies these overrides. Most examples need nothing here; only list the ones
# that want a non-default warm-up, scripted input, or a coverage annotation.
#
# Keys under [examples."<path>"] use the example path relative to examples/
# (the directory that holds main.c), e.g. "input/mouse", "audio/snesmod_music".

default_frames = 200   # PPU frame of the capture (`luna --until-frame N`, ≈ 3.3 s
                       # NTSC — past every example's boot/setup). Frames, NOT
                       # instructions: a codegen change that shifts the
                       # instruction count of a frame cannot move the capture
                       # onto another animation phase (luna issue #222).

# --- Examples that idle in a device-detect state under the VISUAL pillar's
# plain-pad boot (no scripted device input at capture time), so their capture
# is boot-screen-only. Their real functionality IS exercised by the functional
# probes (manifests/mouse.toml, mouse_sensitivity.toml, superscope.toml, run by
# `make test-manifests`) since luna models both devices; input_dependent only
# annotates the coverage/visual pillars.
[examples."input/mouse"]
input_dependent = true

[examples."input/superscope"]
input_dependent = true

# --- Extra warm-up (audio/snesmod_music, basics/random) is no longer needed:
# the old 4M-instruction points were 118 / 239 frames; the 200-frame default
# already sits past the driver load / first value cycles.

# --- Multi-frame opt-in: SELF-animating examples are captured at TWO points.
# A real visual regression breaks both hashes; a pure timing shift breaks only
# one — the runner labels the partial case "timing drift?" so the diagnosis is
# immediate. Extra points cost one luna run each, only here.
#
# Deliberately only these two: the other demo.gif examples (mode7, fading,
# hdma_helpers, mosaic) animate on BUTTON PRESS and idle on the
# same frame at every un-scripted capture point (verified 1M→6M: identical
# fbhash) — a second point there is cost without coverage. Covering their
# animations needs scripted input, which is the functional probes' domain.
[examples."scrolling/parallax_scroll"]
frames = [200, 400]

[examples."color/transparency"]
frames = [200, 400]

# palette cycling rotates CGRAM every frame with no input — self-animating.
[examples."color/palette_cycle"]
frames = [200, 400]

# hero16 walks in place via the anim module since #97 — self-animating.
[examples."sprites/metasprite"]
frames = [200, 400]

# the hand-built HDMA wave (krom port) scrolls from boot — self-animating.
[examples."hdma/hdma_wave"]
frames = [200, 400]

# 32 sprites bounce continuously with no input — self-animating.
[examples."sprites/sprite_swarm"]
frames = [200, 400]

# Mode 2 offset-per-tile: a per-column sine wave that scrolls every frame.
[examples."backgrounds/mode2"]
frames = [200, 400]

[examples."backgrounds/mode4"]
frames = [200, 400]          # the offset-per-tile wave travels

[examples."backgrounds/mode6"]
frames = [200, 400]          # the offset-per-tile wave travels

# DSP-1 cube: the coprocessor rotates 8 corners every frame (self-animating,
# two capture points). Firmware-gated — luna LLE-emulates the DSP-1 and needs
# Sony's dsp1b.rom (copyright, not shipped); CI without it SKIPs the visual +
# WRAM pillars for this example (coverage/liveness still runs — it boots fine,
# the coprocessor just stays inert). A dev/CI with the firmware gets full coverage.
[examples."chips/dsp1_cube"]
firmware = "dsp1b.rom"
frames = [200, 400]

# DSP-1 ground: the coprocessor streams the floor every frame and the camera
# idles, so one capture point suffices; firmware-gated like dsp1_cube.
[examples."mode7/dsp1_ground"]
firmware = "dsp1b.rom"

# --- Hi-res capture (gaps review R8): luna's default view averages the two
# horizontal subpixels of modes 5/6 (512 dots) into 256; `native_res = true`
# captures and hashes the native 512×448 frame instead, so a broken second
# subpixel column cannot blend away.
[examples."backgrounds/mode5_hires"]
native_res = true

# Self-animating examples measured with a single capture point (testing
