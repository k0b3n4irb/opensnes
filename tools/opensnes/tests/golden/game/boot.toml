# A project test: `make test` runs every test/*.toml in luna (`luna test`),
# `make test-update` rewrites the visual baselines (asserts.fbhash).
# Docs: OpenSNES GETTING_STARTED.md, section "Test your game".

rom = "../my_game-2.sfc"
frames = 180                      # run until PPU frame 180, then judge

[asserts]
fbhash = ""                       # the frame's hash; `make test-update` fills it

# WRAM values at the end, by symbol name from the ROM's .sym. A file-scope
# static reads name.<file>: player_x of main.c is "player_x.main".
[[checkpoint]]
at_frame = 180
[checkpoint.values]
"player_x.main" = 120
"player_y.main" = 100
