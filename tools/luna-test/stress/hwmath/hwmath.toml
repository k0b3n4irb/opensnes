# Acceptance test for luna#181: reproduce the OpenSNES probes/hw_math.py
# verdict (CPU hardware multiply/divide, incl. the divide-by-zero quirk) as a
# native `luna test` manifest. Values verified bit-exact vs Mesen2 + fullsnes.
rom = "hwmath.sfc"
# Keys are `results+N` (bytes, decimal; luna v1.28.0): they follow the array
# when RAM moves, which raw addresses did not (they broke on 2026-09-26).
steps = 500000

[asserts]
wdm_empty = true               # no SNES_ASSERT fired during the run

[asserts.values]               # results[] block, little-endian u16
"results+2" = 0xFE01             # results[1]  mul(255,255) = 65025
"results+16" = 0xFFFF             # results[8]  div 1000/0 -> quotient $FFFF (quirk)
"results+18" = 0x03E8             # results[9]  div 1000/0 -> remainder = dividend (1000)
"results+24" = 0xFFFF             # results[12] div 65535/1 -> quotient 65535
"results+30" = 0xC0DE             # results[15] done marker
