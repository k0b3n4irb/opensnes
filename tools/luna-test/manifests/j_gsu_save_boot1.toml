# chips/superfx_save, first power-on: no magic word in Game Pak RAM, boots = 1
# written at $70:E000 and kept by the battery file (srm_out). Chain with
# k_gsu_save_boot2.toml.
rom = "../../../examples/chips/superfx_save/superfx_save.sfc"
frames = 120
# struct fields are not symbols: `now+2` is the boots word two bytes into the block
srm_out = "superfx_save.srm"
[asserts.values]
had_save = 0
"now+2" = 1
gsu_present = 1
