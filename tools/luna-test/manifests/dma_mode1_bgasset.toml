# backgrounds/mode1 — the typed BgAsset bundle lands where the call says.
#
# This example's whole point is `bgLoad(0, &bg, 0, 0x4000, 0x0000)`: ONE call
# that must fan out into three transfers — tiles to VRAM word $4000, tilemap
# to VRAM word $0000, palette to CGRAM slot 0 — with the colour depth and map
# size (BG_16COLORS / SC_32x32) taken from the DECLARE_BG_ASSET declaration
# rather than from the call site. The three blocks below are those three
# destinations, addressed in bytes (VRAM byte = word * 2, so word $4000 is
# byte $8000).
#
# Why liveness/fbhash would not catch a failure here: bgLoad() is the only
# consumer of the BgAsset struct layout, so a field-order slip (tiles/map
# pointers swapped, a stale `_end` label) shows up as "the screen looks
# different" — which the fbhash pillar reports as an unexplained hash and the
# next `--update` silently blesses. These blocks say WHICH of the three
# transfers went wrong, and they are the same bytes the mode1_lz77 manifest
# asserts for the decompressed path, so the two examples are pinned to one
# source of truth.
rom = "../../../examples/backgrounds/mode1/mode1.sfc"
frames = 200

[asserts.blocks]
bg_pal_slot0  = { space = "cgram", offset = "0000", hex = "420c4b51f175a524ad450529a31c612be1267c305e0bc734d54ede7b00000000" }
bg_map_w0000  = { space = "vram",  offset = "0450", hex = "12001200140015001600170018001900" }
bg_tiles_w4000 = { space = "vram", offset = "82E0", hex = "008000800080008f008f008f00810081ff7fff7fff7fff70ff70ff70ff7eff7e" }

# Every VRAM/CGRAM transfer in this example happens once, at boot, under force
# blank; nothing is uploaded per frame. `unsafe_writes = 0` is that invariant —
# the project's first silent failure ("VRAM writes only work during VBlank or
# forced blank"). No `max_vblank_bytes` ceiling: measured VBlank traffic is 0,
# so a ceiling over it would assert nothing.
[asserts.dma]
unsafe_writes = 0
