# aseprite_pipeline — the A toggle between the two clips aseprite2snes
# generated (walk: forward loop, wave: ping-pong), which no other test
# presses.
#
# What this proves that the other pillars cannot:
#   * Liveness and the fbhash baseline only ever see the walk clip:
#     animPlay(hero_anims[1]) and the ping-pong frame table are dead code
#     without input.
#   * The toggle is on padPressed(), an edge: holding A from frame 150 to
#     249 toggles once (at 150), not every frame — the player's clip must
#     stay put between 200 and 250 while A is still held.
#   * The label printed by drawLabel() reaches VRAM: after two toggles the
#     tilemap reads "WALK" again at row 3, column 8 (text tiles are the
#     character minus $20: W A L K = $37 $21 $2C $2B; "WAVE" would be
#     $37 $21 $36 $25). Map at word $6800 -> byte ($6800 + 3*32 + 8) * 2
#     = $D0D0.
#   * The clip is identified through hero_player's first word (the low
#     half of its far pointer to the clip), by change only: its value is a
#     ROM address that moves with the layout, so no absolute value is
#     pinned.
#
# Measured: `luna state --until-frame N --input "90:0x0080,94:0" --peek
# hero_player:8 --dump-vram v.bin --out -`: at 60 the clip is $07:902C
# (walk) and the label bytes are 37002100 2c002b00; at 150 the clip is
# $07:9044 (wave), frame 3, and the label reads 37002100 36002500.
rom = "../../../examples/sprites/aseprite_pipeline/aseprite_pipeline.sfc"

[[checkpoint]]                 # boot: a clip is playing (not a NULL player)
at_frame = 90
[checkpoint.values]
hero_player = { ne = 0, width = 2 }

[[checkpoint]]                 # A at 90: walk -> wave
at_frame = 150
input = "90:0x0080,94:0"
[checkpoint.delta]
hero_player = { dir = "changed", width = 2 }

[[checkpoint]]                 # A pressed at 150 (and held): wave -> walk
at_frame = 200
input = "150:0x0080"
[checkpoint.delta]
hero_player = { dir = "changed", width = 2 }

[[checkpoint]]                 # A still held: an edge, so no second toggle
at_frame = 250
input = "250:0"
[checkpoint.delta]
hero_player = { dir = "unchanged", width = 2 }

[[checkpoint]]                 # released
at_frame = 300
[checkpoint.delta]
hero_player = { dir = "unchanged", width = 2 }

[asserts.blocks]               # label after two toggles: "WALK"
label = { space = "vram", offset = "D0D0", hex = "370021002c002b00" }
