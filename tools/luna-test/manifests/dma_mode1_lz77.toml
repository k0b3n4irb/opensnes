# backgrounds/mode1_lz77 — the LZSS decode reproduces the raw DMA, to the last
# byte of the last tile.
#
# The example replaces `dmaCopyVram(tiles, ...)` with
# `lzssDecodeVram(patterns, $4000)`: 652 compressed ROM bytes expand to 2592
# bytes of 4bpp tile data streamed through the PPU data port. The oracle is
# free and exact — backgrounds/mode1 DMAs the *uncompressed* form of the same
# artwork, so the decompressed VRAM must be byte-identical to it. Verified:
# VRAM $8000-$8A1F is equal in both ROMs; `bg_tiles_w4000` here is literally
# the block dma_mode1_bgasset.toml asserts, at the same offset.
#
# `tail_of_decode` is the assert that earns this file. It is the LAST 32 bytes
# of the 2592-byte expansion. The characteristic LZSS failure is not garbage —
# it is a decode that stops early (a mishandled final flag byte, a back
# reference that runs past the end, an off-by-one on the length header), which
# leaves the tail as the zeros VRAM already held. Those high tiles may be
# barely used by the tilemap, so a truncated decode can look almost right on
# screen: liveness passes, the fbhash differs by a handful of pixels or not at
# all. Here it is a named failure at a named address.
rom = "../../../examples/backgrounds/mode1_lz77/mode1_lz77.sfc"
frames = 200

[asserts.blocks]
palette_slot0  = { space = "cgram", offset = "0000", hex = "420c4b51f175a524ad450529a31c612be1267c305e0bc734d54ede7b00000000" }
bg_tiles_w4000 = { space = "vram",  offset = "82E0", hex = "008000800080008f008f008f00810081ff7fff7fff7fff70ff70ff70ff7eff7e" }
tail_of_decode = { space = "vram",  offset = "8A00", hex = "0000000000000000f0f0f0f0f0f0f0f0000000000000000000f000f000f000f0" }
map_w0000      = { space = "vram",  offset = "0450", hex = "27002700270027002700270027002700" }

# Every VRAM/CGRAM transfer in this example happens once, at boot, under force
# blank; nothing is uploaded per frame. `unsafe_writes = 0` is that invariant —
# the project's first silent failure ("VRAM writes only work during VBlank or
# forced blank"). No `max_vblank_bytes` ceiling: measured VBlank traffic is 0,
# so a ceiling over it would assert nothing.
[asserts.dma]
unsafe_writes = 0
