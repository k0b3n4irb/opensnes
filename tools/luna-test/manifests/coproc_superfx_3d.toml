# Migrated from probes/coproc.py — coprocessor executed >=1 instruction.
rom = "../../../examples/chips/superfx_3d/superfx_3d.sfc"
steps = 1000000
[asserts.trace]
superfx = { min = 1 }

# luna v1.27.0 (2026-09-26): the GSU's own state. bus_violations counts CPU
# reads of Game Pak ROM / RAM while the GSU owns them (RON / RAN) — garbage
# on hardware, silent everywhere. Vector fetches during a job are counted
# apart (bus_vector_fetches) because they are the interrupt mechanism, not a
# fault. On a cart with no GSU this table fails instead of passing vacuously.
[asserts.gsu]
bus_violations = 0
instructions_executed = { gt = 10000 }   # a frame of the 3D demo runs tens of thousands of GSU instructions
